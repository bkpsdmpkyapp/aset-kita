                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Status Progres</label>
                                <select value={formData.status} onChange={(e) => setFormData({...formData, status: e.target.value})} className="w-1/2 border px-3 py-2 rounded-md bg-white font-semibold">
                                    <option value="Proses">Proses (Dalam Pengerjaan)</option>
                                    <option value="Tertunda">Tertunda (Menunggu Vendor/Sparepart)</option>
                                    <option value="Selesai">Selesai</option>
                                </select>
                            </div>
                            <div className="md:col-span-2 flex justify-end mt-4 pt-4 border-t">
                                <button type="button" onClick={() => { setIsFormMode(false); setEditingId(null); }} className="bg-gray-200 px-6 py-2 rounded-md mr-3">Batal</button>
                                <button type="button" onClick={submitPemeliharaan} className="bg-indigo-600 text-white px-6 py-2 rounded-md shadow-lg hover:bg-indigo-700">{editingId ? 'Update Pemeliharaan' : 'Simpan Pemeliharaan'}</button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <button onClick={() => { setIsFormMode(true); setEditingId(null); setSearchKeyword(''); setFormData({ kode: '', register: '', tanggal: new Date().toISOString().split('T')[0], jenis: 'Perbaikan Kerusakan', kegiatan: '', status: 'Proses', aduanId: null }); }} className="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-md font-medium text-sm">+ Catat Pemeliharaan</button>
                        <div className="flex items-center gap-2">
                            <label className="text-sm text-gray-600 font-medium">Filter Status:</label>
                            <select value={statusFilter} onChange={(e) => {setStatusFilter(e.target.value); setPagePem(1);}} className="border px-3 py-2 rounded-md focus:ring-indigo-500 bg-white text-sm">
                                <option value="">Semua Status</option><option value="Proses">Proses</option><option value="Tertunda">Tertunda</option><option value="Selesai">Selesai</option>
                            </select>
                        </div>
                    </div>
                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Tgl Mulai</th><th className="p-3 border-b">Barang (Kode-Reg)</th><th className="p-3 border-b">Jenis</th><th className="p-3 border-b">Kegiatan</th><th className="p-3 border-b">Status</th><th className="p-3 border-b text-center">Aksi</th></tr></thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item) => (
                                    <tr key={item.id} className="hover:bg-gray-50 border-b border-gray-100 text-sm">
                                        <td className="p-3 text-gray-600">{item.tanggal}</td>
                                        <td className="p-3 font-medium text-gray-800">{item.namaBarang}<br/><span className="text-xs text-gray-500">{item.kode} - {item.register}</span></td>
                                        <td className="p-3 text-gray-600">{item.jenis}</td>
                                        <td className="p-3 text-gray-600 max-w-xs truncate" title={item.kegiatan}>{item.kegiatan}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded-full text-xs font-semibold ${getStatusColor(item.status)}`}>{item.status}</span></td>
                                        <td className="p-3 text-center">
                                            <button onClick={() => openEditForm(item)} className="text-indigo-600 hover:text-indigo-800 bg-indigo-50 p-2 rounded-full" title="Update Progres"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                        </td>
                                    </tr>
                                )) : <tr><td colSpan="6" className="p-4 text-center text-gray-500">Belum ada data pemeliharaan.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{filteredPemeliharaan.length > 0 ? (pagePem - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pagePem * itemsPerPage, filteredPemeliharaan.length)}</span> dari <span className="font-bold">{filteredPemeliharaan.length}</span> entri</p>
                        <div className="flex space-x-1 mt-2 md:mt-0">
                            <button onClick={() => setPagePem(Math.max(1, pagePem - 1))} disabled={pagePem === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-indigo-600 text-white rounded">{pagePem}</span>
                            <button onClick={() => setPagePem(Math.min(totalPages, pagePem + 1))} disabled={pagePem === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 10. KOMPONEN ADUAN
        // ==========================================
        function Aduan({ user, onNavigate, barangList, aduanList, setAduanList }) {
            const [isFormMode, setIsFormMode] = useState(false);
            const [statusFilter, setStatusFilter] = useState('');
            const [pageAduan, setPageAduan] = useState(1);
            const [searchKeyword, setSearchKeyword] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const [formData, setFormData] = useState({ kode: '', register: '', keterangan: '' });

            const handleSearchChange = (e) => {
                const keyword = e.target.value; setSearchKeyword(keyword);
                if (keyword.length > 1) {
                    const results = barangList.filter(b => b.status === 'Aktif' && (b.nama.toLowerCase().includes(keyword.toLowerCase()) || b.merk.toLowerCase().includes(keyword.toLowerCase())));
                    setSearchResults(results); setShowDropdown(true);
                } else setShowDropdown(false);
            };

            const handleSelectBarang = (barang) => {
                setSearchKeyword(barang.nama); setFormData({ ...formData, kode: barang.kode, register: barang.register }); setShowDropdown(false);
            };

            const handleBlur = () => setTimeout(() => setShowDropdown(false), 200);

            const filteredAduan = aduanList.filter(item => statusFilter === '' || item.status === statusFilter);
            const itemsPerPage = 20;
            const totalPages = Math.ceil(filteredAduan.length / itemsPerPage);
            const currentData = filteredAduan.slice((pageAduan - 1) * itemsPerPage, pageAduan * itemsPerPage);

            const tindakLanjut = (item) => {
                setAduanList(prev => prev.map(a => a.id === item.id ? { ...a, status: 'Proses' } : a));
                onNavigate('pemeliharaan', { nama: item.namaBarang, kode: item.kodeBarang, register: item.noRegister, deskripsiAduan: item.keterangan, aduanId: item.id });
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8">
                        <div className="flex justify-between items-center mb-6 border-b pb-4"><h2 className="text-xl font-bold text-gray-800">Form Tambah Aduan Kerusakan</h2><button onClick={() => setIsFormMode(false)} className="text-gray-500 hover:text-red-500 font-medium text-sm">Kembali</button></div>
                        <form className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="relative md:col-span-2 lg:col-span-1">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Cari Nama Barang <span className="text-red-500">*</span></label>
                                <input type="text" value={searchKeyword} onChange={handleSearchChange} onBlur={handleBlur} placeholder="Ketik nama atau merk..." className="w-full border px-3 py-2 rounded-md focus:ring-orange-500 focus:border-orange-500" autoComplete="off" />
                                {showDropdown && searchResults.length > 0 && (
                                    <ul className="absolute z-20 w-full bg-white border border-gray-200 mt-1 max-h-56 overflow-y-auto shadow-xl rounded-md divide-y divide-gray-100">
                                        {searchResults.map((b) => (
                                            <li key={b.id} onClick={() => handleSelectBarang(b)} className="p-3 hover:bg-orange-50 cursor-pointer transition">
                                                <div className="font-bold text-gray-800 text-sm">{b.nama}</div>
                                                <div className="text-xs text-gray-500 mt-0.5">Merk: {b.merk} • Tahun: {b.tahun} • Ruang: {b.ruang}</div>
                                                <div className="text-xs text-blue-600 mt-1 italic font-medium">Ket: {b.keterangan}</div>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </div>
                            <div className="grid grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">Kode Barang</label><input type="text" value={formData.kode} className="w-full border px-3 py-2 rounded-md bg-gray-100" readOnly placeholder="Otomatis" /></div>
                                <div><label className="block text-sm font-medium text-gray-700 mb-1">No Register</label><input type="text" value={formData.register} className="w-full border px-3 py-2 rounded-md bg-gray-100" readOnly placeholder="Otomatis" /></div>
                            </div>
                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Status Aduan (Otomatis)</label>
                                <input type="text" value="Menunggu" className="w-1/2 border px-3 py-2 rounded-md bg-orange-50 text-orange-700 font-bold cursor-not-allowed" readOnly />
                            </div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Keterangan Aduan (Keluhan)</label><textarea rows="3" className="w-full border px-3 py-2 rounded-md focus:ring-orange-500"></textarea></div>
                            <div className="md:col-span-2 flex justify-end mt-4 pt-4 border-t">
                                <button type="button" onClick={() => setIsFormMode(false)} className="bg-gray-200 text-gray-800 px-6 py-2 rounded-md mr-3">Batal</button>
                                <button type="button" onClick={() => setIsFormMode(false)} className="bg-orange-600 text-white px-6 py-2 rounded-md shadow-lg hover:bg-orange-700">Kirim Aduan</button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6 relative">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <button onClick={() => setIsFormMode(true)} className="bg-orange-600 hover:bg-orange-700 text-white px-4 py-2 rounded-md font-medium text-sm">+ Buat Aduan</button>
                        <div className="flex items-center gap-2">
                            <label className="text-sm text-gray-600 font-medium">Filter Status:</label>
                            <select value={statusFilter} onChange={(e) => {setStatusFilter(e.target.value); setPageAduan(1);}} className="border px-3 py-2 rounded-md focus:ring-orange-500 bg-white text-sm">
                                <option value="">Semua Status</option><option value="Menunggu">Menunggu</option><option value="Proses">Proses</option><option value="Selesai">Selesai</option><option value="Tertunda">Tertunda</option><option value="Usul Hapus">Usul Hapus</option>
                            </select>
                        </div>
                    </div>
                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 text-gray-700 text-sm"><th className="p-3 border-b">ID Aduan</th><th className="p-3 border-b">Barang</th><th className="p-3 border-b">Tgl Aduan</th><th className="p-3 border-b">Keterangan</th><th className="p-3 border-b">Status</th><th className="p-3 border-b text-center">Aksi</th></tr></thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item) => (
                                    <tr key={item.id} className="hover:bg-gray-50 border-b border-gray-100 text-sm">
                                        <td className="p-3 text-gray-600">#{item.id}</td>
                                        <td className="p-3 font-medium text-gray-800">{item.namaBarang}<br/><span className="text-xs text-gray-500">{item.kodeBarang} - {item.noRegister}</span></td>
                                        <td className="p-3 text-gray-600">{item.tanggal}</td>
                                        <td className="p-3 text-gray-600">{item.keterangan}</td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded-full text-xs font-semibold ${getStatusColor(item.status)}`}>{item.status}</span></td>
                                        <td className="p-3 text-center">
                                            {item.status === 'Menunggu' && (
                                                <button onClick={() => tindakLanjut(item)} className="bg-indigo-100 text-indigo-700 px-2 py-1 rounded hover:bg-indigo-200 text-xs font-semibold mx-auto flex items-center">Tindak Lanjut</button>
                                            )}
                                        </td>
                                    </tr>
                                )) : <tr><td colSpan="6" className="p-4 text-center text-gray-500">Tidak ada data aduan.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{filteredAduan.length > 0 ? (pageAduan - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pageAduan * itemsPerPage, filteredAduan.length)}</span> dari <span className="font-bold">{filteredAduan.length}</span> entri</p>
                        <div className="flex space-x-1 mt-2 md:mt-0">
                            <button onClick={() => setPageAduan(Math.max(1, pageAduan - 1))} disabled={pageAduan === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-orange-600 text-white rounded">{pageAduan}</span>
                            <button onClick={() => setPageAduan(Math.min(totalPages, pageAduan + 1))} disabled={pageAduan === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 11. KOMPONEN LAPORAN 
        // ==========================================
        function Laporan({ barangList, aduanList, pemeliharaanList, ruanganList, appConfig }) {
            const currentYear = new Date().getFullYear();
            const today = new Date().toISOString().split('T')[0];
            const firstDay = `${currentYear}-01-01`;

            const [jenisLaporan, setJenisLaporan] = useState('Data Barang Keseluruhan');
            const [tglMulai, setTglMulai] = useState(firstDay);
            const [tglAkhir, setTglAkhir] = useState(today);

            const processDownload = (format) => {
                let dataToExport = [];
                let reportTitle = jenisLaporan;

                if (jenisLaporan === 'Data Barang Keseluruhan' || jenisLaporan === 'Data Barang Rusak') {
                    let data = barangList.filter(b => b.status === 'Aktif');
                    if (jenisLaporan === 'Data Barang Rusak') { data = data.filter(d => d.keadaan.includes('Rusak')); }
                    dataToExport = data.map(b => ({ 'Kode Barang': b.kode, 'Register': b.register, 'Nama Barang': b.nama, 'Merk': b.merk, 'Tahun': b.tahun, 'Keadaan': b.keadaan, 'Ruang': b.ruang }));
                } else if (jenisLaporan === 'Data Pemeliharaan Aset') {
                    dataToExport = pemeliharaanList.map(p => ({ 'Tgl Pemeliharaan': p.tanggal, 'Barang': p.namaBarang, 'Kode': p.kode, 'Jenis': p.jenis, 'Kegiatan': p.kegiatan, 'Status': p.status }));
                } else if (jenisLaporan === 'Data Aduan Kerusakan') {
                    dataToExport = aduanList.map(a => ({ 'ID Aduan': a.id, 'Tgl Aduan': a.tanggal, 'Barang': a.namaBarang, 'Keluhan': a.keterangan, 'Status': a.status }));
                }

                if (dataToExport.length === 0) { alert('Tidak ada data yang tersedia untuk di-export.'); return; }

                if (format === 'Excel') {
                    const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                    XLSX.utils.sheet_add_aoa(worksheet, [
                        [],
                        [`Palangka Raya, ${formatDateID(today)}`],
                        [appConfig.jabatanPimpinan],
                        [],
                        [],
                        [appConfig.namaPimpinan],
                        [`NIP. ${appConfig.nipPimpinan}`]
                    ], { origin: -1 });

                    const workbook = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan");
                    XLSX.writeFile(workbook, `Laporan_${reportTitle}_${tglAkhir}.xlsx`);
                } 
                else if (format === 'PDF') {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(14); doc.text(`Laporan: ${reportTitle}`, 14, 15);
                    doc.setFontSize(10); doc.text(`Periode: ${tglMulai} s.d ${tglAkhir}`, 14, 22);
                    
                    const headers = Object.keys(dataToExport[0]);
                    const rows = dataToExport.map(obj => Object.values(obj));
                    
                    doc.autoTable({ 
                        head: [headers], 
                        body: rows, 
                        startY: 28, 
                        styles: { fontSize: 8 }, 
                        headStyles: { fillColor: [30, 64, 175] }
                    });

                    doc.setFontSize(10);
                    doc.setFont("helvetica", "normal");
                    
                    const texts = [`Palangka Raya, ${formatDateID(today)}`, appConfig.jabatanPimpinan, appConfig.namaPimpinan, `NIP. ${appConfig.nipPimpinan}`];
                    let maxTextWidth = 0;
                    texts.forEach(t => { const width = doc.getTextWidth(t); if(width > maxTextWidth) maxTextWidth = width; });
                    
                    const pageSize = doc.internal.pageSize;
                    const pageWidth = pageSize.width ? pageSize.width : pageSize.getWidth();
                    const pageHeight = pageSize.height ? pageSize.height : pageSize.getHeight();
                    
                    const rightMargin = 14;
                    const startX = pageWidth - rightMargin - maxTextWidth; 

                    let finalY = doc.lastAutoTable.finalY + 15;
                    
                    if (finalY + 45 > pageHeight) { doc.addPage(); finalY = 30; }

                    doc.text(`Palangka Raya, ${formatDateID(today)}`, startX, finalY);
                    doc.text(appConfig.jabatanPimpinan, startX, finalY + 5);
                    finalY += 25; 
                    doc.text(appConfig.namaPimpinan, startX, finalY);
                    doc.text(`NIP. ${appConfig.nipPimpinan}`, startX, finalY + 5);
                    
                    doc.save(`Laporan_${reportTitle}_${tglAkhir}.pdf`);
                } 
                else if (format === 'Print') { 
                    window.print(); 
                }
            };

            return (
                <div className="max-w-4xl mx-auto bg-white rounded-lg shadow-lg overflow-hidden">
                    <div className="bg-blue-800 p-6 text-white no-print">
                        <h2 className="text-2xl font-bold">Pusat Unduhan Laporan</h2>
                        <p className="text-blue-200 text-sm mt-1">Tarik dan cetak data inventaris aset, aduan, dan pemeliharaan berdasarkan periode.</p>
                    </div>

                    <div className="hidden print:block p-8">
                        <h1 className="text-2xl font-bold text-center mb-1">LAPORAN {jenisLaporan.toUpperCase()}</h1>
                        <h3 className="text-sm text-center mb-6">Periode: {tglMulai} s.d {tglAkhir}</h3>
                        
                        <div className="mt-16 flex justify-end">
                            <div className="text-left text-sm leading-relaxed inline-block">
                                <p className="mb-3">Palangka Raya, {formatDateID(today)}</p>
                                <p>{appConfig.jabatanPimpinan}</p>
                                <br/><br/><br/>
                                <p className="font-bold">{appConfig.namaPimpinan}</p>
                                <p>NIP. {appConfig.nipPimpinan}</p>
                            </div>
                        </div>
                    </div>

                    <div className="p-8 no-print">
                        <div className="space-y-6">
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Pilih Jenis Laporan</label>
                                <select value={jenisLaporan} onChange={(e) => setJenisLaporan(e.target.value)} className="w-full md:w-2/3 border-gray-300 border px-4 py-3 rounded-md focus:ring-blue-500 bg-gray-50 font-medium">
                                    <option value="Data Barang Keseluruhan">Data Inventaris Barang Keseluruhan</option>
                                    <option value="Data Pemeliharaan Aset">Data Pemeliharaan Aset</option>
                                    <option value="Data Aduan Kerusakan">Data Aduan Kerusakan</option>
                                    <option value="Data Barang Rusak">Data Barang Rusak/Usul Hapus</option>
                                </select>
                            </div>
                            <div className="flex flex-col md:flex-row gap-6">
                                <div className="flex-1"><label className="block text-sm font-bold text-gray-700 mb-2">Periode Dari Tanggal</label><input type="date" value={tglMulai} onChange={(e) => setTglMulai(e.target.value)} className="w-full border-gray-300 border px-4 py-3 rounded-md" /></div>
                                <div className="flex-1"><label className="block text-sm font-bold text-gray-700 mb-2">Sampai Tanggal</label><input type="date" value={tglAkhir} onChange={(e) => setTglAkhir(e.target.value)} className="w-full border-gray-300 border px-4 py-3 rounded-md" /></div>
                            </div>
                            <div className="pt-6 border-t flex flex-col sm:flex-row gap-4">
                                <button onClick={() => processDownload('PDF')} className="flex-1 flex justify-center items-center bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-md shadow-md">Download PDF</button>
                                <button onClick={() => processDownload('Excel')} className="flex-1 flex justify-center items-center bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md shadow-md">Export Excel</button>
                                <button onClick={() => processDownload('Print')} className="flex-1 flex justify-center items-center bg-gray-600 hover:bg-gray-700 text-white font-bold py-3 px-4 rounded-md shadow-md">Cetak Langsung</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 12. KOMPONEN PENGATURAN
        // ==========================================
        function Pengaturan({ user, appConfig, setAppConfig }) {
            if (user.role === 'pegawai') {
                return (
                    <div className="bg-red-50 border border-red-200 text-red-700 p-6 rounded-lg text-center">
                        <h3 className="text-lg font-bold">Akses Ditolak</h3>
                        <p className="text-sm mt-1">Halaman Pengaturan hanya dapat diakses oleh Admin Super dan Pengurus Aset.</p>
                    </div>
                );
            }

            const [localConfig, setLocalConfig] = useState(appConfig);

            const handleSave = (e) => {
                e.preventDefault();
                setAppConfig(localConfig);
                alert('Pengaturan sistem dan data pimpinan OPD berhasil disimpan!');
            };

            return (
                <div className="max-w-3xl mx-auto bg-white rounded-lg shadow p-6 mb-10">
                    <h2 className="text-xl font-bold text-gray-800 mb-4 pb-2 border-b">Pengaturan Sistem & Data Pimpinan OPD</h2>
                    <form onSubmit={handleSave} className="space-y-6">
                        <div>
                            <label className="block text-sm font-medium text-gray-700 mb-1">Nama Aplikasi / Instansi</label>
                            <input type="text" value={localConfig.appName} onChange={e=>setLocalConfig({...localConfig, appName: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" required />
                        </div>

                        <div className="border-t pt-4 space-y-4">
                            <h3 className="font-semibold text-gray-800">Keamanan Sistem</h3>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Passphrase Eksekusi Aset</label>
                                <p className="text-xs text-gray-500 mb-2">Kata sandi khusus yang digunakan admin untuk menambah/menghapus aset dan menyetujui usulan penghapusan.</p>
                                <input type="text" value={localConfig.systemPassphrase} onChange={e=>setLocalConfig({...localConfig, systemPassphrase: e.target.value})} className="w-full md:w-1/2 border px-3 py-2 rounded-md focus:ring-red-500 bg-red-50 text-red-800 font-bold" required />
                            </div>
                        </div>

                        <div className="border-t pt-4 space-y-4">
                            <h3 className="font-semibold text-gray-800">Pejabat Penandatangan Laporan</h3>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Jabatan Pimpinan OPD</label>
                                <input type="text" value={localConfig.jabatanPimpinan} onChange={e=>setLocalConfig({...localConfig, jabatanPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" required />
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">Nama Pimpinan</label>
                                    <input type="text" value={localConfig.namaPimpinan} onChange={e=>setLocalConfig({...localConfig, namaPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" placeholder="Contoh: Dr. H. Ahmad, M.Si" required />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">NIP Pimpinan</label>
                                    <input type="text" value={localConfig.nipPimpinan} onChange={e=>setLocalConfig({...localConfig, nipPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" placeholder="Contoh: 19750317 199903 1 005" required />
                                </div>
                            </div>
                        </div>

                        <div className="border-t pt-4 space-y-4">
                            <h3 className="font-semibold text-gray-800">Preferensi Sistem</h3>
                            <label className="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" checked={localConfig.autoBackup} onChange={e=>setLocalConfig({...localConfig, autoBackup: e.target.checked})} className="w-4 h-4 text-blue-600 rounded" />
                                <div><p className="text-sm font-medium text-gray-800">Auto Backup Database Harian</p><p className="text-xs text-gray-500">Mencadangkan data aset otomatis ke server lokal setiap pukul 00.00</p></div>
                            </label>
                            <label className="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" checked={localConfig.notifEmail} onChange={e=>setLocalConfig({...localConfig, notifEmail: e.target.checked})} className="w-4 h-4 text-blue-600 rounded" />
                                <div><p className="text-sm font-medium text-gray-800">Notifikasi Email Tiket Aduan</p><p className="text-xs text-gray-500">Kirim pemberitahuan otomatis ke pengurus saat ada aduan baru masuk</p></div>
                            </label>
                            <label className="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" checked={localConfig.maintenanceMode} onChange={e=>setLocalConfig({...localConfig, maintenanceMode: e.target.checked})} className="w-4 h-4 text-red-600 rounded" />
                                <div><p className="text-sm font-medium text-red-700">Mode Pemeliharaan Sistem (Maintenance Mode)</p><p className="text-xs text-gray-500">Batasi akses login hanya untuk Admin Super</p></div>
                            </label>
                        </div>
                        <div className="flex justify-end pt-4 border-t">
                            <button type="submit" className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md font-medium shadow transition">Simpan Pengaturan</button>
                        </div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 13. APP UTAMA
        // ==========================================
        function App() {
            const [user, setUser] = useState(null); 
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [navParams, setNavParams] = useState(null);

            const [appConfig, setAppConfig] = useState({
                appName: 'Badan Kepegawaian dan Pengembangan Sumber Daya Manusia',
                jabatanPimpinan: 'Kepala Badan Kepegawaian dan Pengembangan Sumber Daya Manusia Kota Palangka Raya',
                namaPimpinan: 'Dr. FAUZI RAHMAN, S.Sos., M.A.P',
                nipPimpinan: '19750317 199903 1 004',
                systemPassphrase: 'rahasia123',
                autoBackup: true,
                maintenanceMode: false
            });

            const [barangList, setBarangList] = useState(
                Array.from({ length: 95 }, (_, i) => ({
                    id: i + 1, no: i + 1,
                    kode: `1.3.1.${String((i%5)+1)}`,
                    register: String(i + 1).padStart(4, '0'),
                    nama: i % 2 === 0 ? 'AC Split' : 'Laptop Asus ROG',
                    merk: i % 2 === 0 ? 'LG' : 'Asus',
                    tahun: 2021 + (i % 3),
                    keadaan: i % 7 === 0 ? 'Rusak Berat' : (i % 5 === 0 ? 'Rusak Ringan' : 'Baik'),
                    ruang: i % 2 === 0 ? 'Ruangan UMPEG' : 'Ruang Tata Usaha',
                    keterangan: i % 2 === 0 ? 'Dipakai Staff IT' : 'Posisi di Meja Pelayanan',
                    cekFisik: 'Belum',
                    foto: '',
                    status: 'Aktif',
                    updateCount: 0
                }))
            );

            const [ruanganList, setRuanganList] = useState([
                { id: 1, no: 'R-001', nama: 'Ruangan UMPEG', pj: 'ERI PURWATI, S.Sos', jabatan: 'Kepala Sub Bag Umum dan Kepegawaian', nipPj: '19830505 201001 2 036' },
                { id: 2, no: 'R-002', nama: 'Ruang Tata Usaha', pj: 'Ibu Siti', jabatan: 'Kasubag TU', nipPj: '19800101 200501 2 001' },
                { id: 3, no: 'R-003', nama: 'Ruang IT', pj: 'Budi Santoso', jabatan: 'Kepala IT', nipPj: '19900202 201502 1 002' }
            ]);

            const [aduanList, setAduanList] = useState(
                Array.from({ length: 15 }, (_, i) => ({
                    id: 1000 + i, kodeBarang: `12.01.${String((i%5)+1).padStart(3, '0')}`, noRegister: '0001', namaBarang: i % 2 === 0 ? 'AC Daikin 1 PK' : 'Laptop Asus ROG',
                    tanggal: '2026-09-10', keterangan: i % 3 === 0 ? 'AC Tidak Dingin' : 'Keyboard rusak', status: i < 5 ? 'Menunggu' : 'Proses'
                }))
            );

            const [pemeliharaanList, setPemeliharaanList] = useState(
                Array.from({ length: 5 }, (_, i) => ({
                    id: 2000 + i, namaBarang: i % 2 === 0 ? 'Printer Epson' : 'AC Panasonic', kode: '12.01.002', register: '0001',
                    tanggal: '2026-09-15', jenis: 'Rutin', kegiatan: 'Service', status: 'Selesai', aduanId: null
                }))
            );

            const [pengadaanList, setPengadaanList] = useState([
                { id: 1, noUsulan: 'PGD-2026-0001', tglUsul: '2026-09-01', namaBarang: 'PC Desktop Core i7', jumlah: 5, estimasiHarga: 12000000, peruntukan: 'Ruang IT', pengusul: 'Budi Santoso', keterangan: 'Kebutuhan upgrade server lokal' }
            ]);
            const [usulanHapus, setUsulanHapus] = useState([]);

            const handleNavigate = (page, params = null) => {
                setCurrentPage(page);
                setNavParams(params);
            };

            if (!user) return <Login onLogin={(userData) => { setUser(userData); handleNavigate('dashboard'); }} />;

            return (
                <Layout user={user} currentPage={currentPage} onNavigate={handleNavigate} onLogout={() => setUser(null)}>
                    {currentPage === 'dashboard' && <Dashboard />}
                    {currentPage === 'databarang' && <DataBarang user={user} appConfig={appConfig} ruanganList={ruanganList} barangList={barangList} setBarangList={setBarangList} />}
                    {currentPage === 'inventaris' && <Inventaris appConfig={appConfig} ruanganList={ruanganList} barangList={barangList} setBarangList={setBarangList} />}
                    {currentPage === 'pengadaan' && <Pengadaan user={user} pengadaanList={pengadaanList} setPengadaanList={setPengadaanList} />}
                    {currentPage === 'penghapusan' && <Penghapusan user={user} appConfig={appConfig} barangList={barangList} setBarangList={setBarangList} usulanHapus={usulanHapus} setUsulanHapus={setUsulanHapus} />}
                    {currentPage === 'ruangan' && <Ruangan ruanganList={ruanganList} setRuanganList={setRuanganList} user={user} />}
                    {currentPage === 'pemeliharaan' && <Pemeliharaan user={user} navParams={navParams} barangList={barangList} pemeliharaanList={pemeliharaanList} setPemeliharaanList={setPemeliharaanList} setAduanList={setAduanList} />}
                    {currentPage === 'aduan' && <Aduan user={user} onNavigate={handleNavigate} barangList={barangList} aduanList={aduanList} setAduanList={setAduanList} />}
                    {currentPage === 'laporan' && <Laporan barangList={barangList} aduanList={aduanList} pemeliharaanList={pemeliharaanList} ruanganList={ruanganList} appConfig={appConfig} />}
                    {currentPage === 'pengaturan' && <Pengaturan user={user} appConfig={appConfig} setAppConfig={setAppConfig} />}
                </Layout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
