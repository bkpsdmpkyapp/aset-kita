<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aset Kita - Sistem Informasi Inventaris</title>
    
    <!-- Library CSS & React -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Library Grafik & Export Dokumen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        @media print {
            aside, header, .no-print { display: none !important; }
            main { padding: 0 !important; background: white !important; }
            .shadow-lg { box-shadow: none !important; }
            .page-break { page-break-after: always; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // 0. FUNGSI BANTU GLOBAL
        // ==========================================
        const getStatusColor = (status) => {
            switch(status) {
                case 'Menunggu': return 'bg-blue-100 text-blue-700';
                case 'Proses': return 'bg-yellow-100 text-yellow-700';
                case 'Selesai': return 'bg-green-100 text-green-700';
                case 'Tertunda': return 'bg-gray-200 text-gray-700';
                case 'Usul Hapus': return 'bg-red-100 text-red-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        };

        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        };

        const formatDateID = (dateStr) => {
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            return new Date(dateStr).toLocaleDateString('id-ID', options);
        };

        // ==========================================
        // 1. KOMPONEN LOGIN
        // ==========================================
        function Login({ onLogin }) {
            const [username, setUsername] = useState('admin1');
            const [password, setPassword] = useState('123');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                if (username === 'admin1' && password === '123') onLogin({ username: 'admin1', role: 'adminsuper', name: 'Admin Super' });
                else if (username === 'pegawai1' && password === '123') onLogin({ username: 'pegawai1', role: 'pegawai', name: 'Pegawai Biasa' });
                else if (username === 'pengurus1' && password === '123') onLogin({ username: 'pengurus1', role: 'pengurus', name: 'Pengurus Aset' });
                else setError('Username atau password salah!');
            };

            return (
                <div className="h-screen flex items-center justify-center bg-gray-900/50 bg-cover bg-center" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80')" }}>
                    <div className="bg-white/95 backdrop-blur-md rounded-lg shadow-2xl p-10 w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="flex justify-center items-center gap-2 mb-2"><svg className="w-10 h-10 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><h1 className="text-3xl font-bold text-gray-800">Aset Kita</h1></div>
                            <p className="text-sm font-semibold text-gray-500 uppercase tracking-wide">Masuk Ke Sistem</p>
                        </div>
                        {error && <div className="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm text-center font-medium">{error}</div>}
                        <form onSubmit={handleLogin}>
                            <div className="mb-4"><input type="text" placeholder="Username (admin1/pegawai1/pengurus1)" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required /></div>
                            <div className="mb-6"><input type="password" placeholder="Kata Sandi (123)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required /></div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">Masuk</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 2. KOMPONEN LAYOUT (SIDEBAR & HEADER)
        // ==========================================
        function Layout({ children, user, currentPage, onNavigate, onLogout }) {
            const [showDropdown, setShowDropdown] = useState(false);
            const dropdownRef = useRef(null);

            const navItems = [
                { id: 'dashboard', label: 'Dashboard' }, 
                { id: 'databarang', label: 'Data Barang' }, 
                { id: 'inventaris', label: 'Inventaris Barang' }, 
                { id: 'pengadaan', label: 'Usul Pengadaan' },
                { id: 'penghapusan', label: 'Usul Penghapusan' },
                { id: 'ruangan', label: 'Ruangan' },
                { id: 'pemeliharaan', label: 'Pemeliharaan' }, 
                { id: 'aduan', label: 'Aduan' }, 
                ...(user.role !== 'pegawai' ? [{ id: 'laporan', label: 'Laporan' }] : []),
                ...(user.role !== 'pegawai' ? [{ id: 'pengaturan', label: 'Pengaturan' }] : [])
            ];

            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
                        setShowDropdown(false);
                    }
                };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="bg-gray-100 flex h-screen overflow-hidden">
                    <aside className="w-64 bg-[#1e293b] text-white flex flex-col z-20 shadow-xl no-print">
                        <div className="h-16 flex items-center px-6 border-b border-gray-700"><svg className="w-8 h-8 text-blue-400 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span className="text-xl font-bold">Aset Kita</span></div>
                        <div className="px-6 py-4 border-b border-gray-700"><p className="text-xs text-gray-400 uppercase tracking-wider">Login sebagai:</p><p className="font-semibold text-blue-400 capitalize">{user.role}</p></div>
                        <nav className="flex-1 px-4 py-4 space-y-1 overflow-y-auto custom-scrollbar">
                            {navItems.map(item => (<button key={item.id} onClick={() => onNavigate(item.id)} className={`w-full flex items-center px-4 py-2.5 rounded-md font-medium text-left transition-colors ${currentPage === item.id ? 'bg-blue-600/20 text-blue-400' : 'text-gray-300 hover:bg-gray-800'}`}>{item.label}</button>))}
                        </nav>
                    </aside>
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10 no-print">
                            <h2 className="font-semibold text-lg text-gray-800 capitalize">{currentPage.replace(/([A-Z])/g, ' $1').trim()}</h2>
                            
                            <div className="relative" ref={dropdownRef}>
                                <div onClick={() => setShowDropdown(!showDropdown)} className="flex items-center space-x-3 cursor-pointer hover:bg-gray-50 p-2 rounded-lg transition">
                                    <span className="text-sm font-medium text-gray-700">{user.name}</span>
                                    <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold shadow">{user.name.charAt(0)}</div>
                                </div>
                                {showDropdown && (
                                    <div className="absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-md shadow-xl py-1 z-50">
                                        <button onClick={() => { onNavigate('profil'); setShowDropdown(false); }} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">
                                            Profil Saya
                                        </button>
                                        <div className="border-t border-gray-100 my-1"></div>
                                        <button onClick={() => { onLogout(); setShowDropdown(false); }} className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center">
                                            Keluar
                                        </button>
                                    </div>
                                )}
                            </div>
                        </header>
                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">{children}</main>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. KOMPONEN DASHBOARD
        // ==========================================
        function Dashboard() {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            useEffect(() => {
                if (chartRef.current) {
                    const ctx = chartRef.current.getContext('2d');
                    if (chartInstance.current) chartInstance.current.destroy();
                    chartInstance.current = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'],
                            datasets: [{ label: 'Jumlah Input Barang', data: [12, 19, 15, 25, 22, 10, 5], backgroundColor: '#0ea5e9', borderRadius: 4 }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'top' } }, scales: { y: { beginAtZero: true } } }
                    });
                }
                return () => { if (chartInstance.current) chartInstance.current.destroy(); };
            }, []);
            return (
                <div>
                    <h2 className="text-2xl font-bold mb-4 text-gray-800">Dashboard Overview</h2>
                    <div className="flex flex-col lg:flex-row gap-6">
                        <div className="w-full lg:w-1/3 space-y-6">
                            <div className="bg-cyan-600 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Total Barang Aktif</p><p className="text-3xl font-bold mt-2">1,254</p></div>
                            <div className="bg-green-500 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Kondisi Baik</p><p className="text-3xl font-bold mt-2">1,020</p></div>
                            <div className="bg-yellow-500 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Rusak Ringan/Berat</p><div className="flex gap-4 mt-2"><p className="text-2xl font-bold">180 <span className="text-sm font-normal">Ringan</span></p><p className="text-2xl font-bold">54 <span className="text-sm font-normal">Berat</span></p></div></div>
                            <div className="bg-red-500 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Aduan Menunggu</p><p className="text-3xl font-bold mt-2">12</p></div>
                        </div>
                        <div className="w-full lg:w-2/3 bg-white rounded-lg shadow p-6">
                            <h3 className="text-lg font-semibold mb-4 text-gray-800">Grafik Inputan User (7 Hari Terakhir)</h3>
                            <div className="h-80 w-full relative"><canvas ref={chartRef}></canvas></div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. KOMPONEN DATA BARANG
        // ==========================================
        function DataBarang({ user, appConfig, ruanganList, barangList, setBarangList }) {
            const [showPassphraseModal, setShowPassphraseModal] = useState(false);
            const [passphrase, setPassphrase] = useState('');
            const [passphraseError, setPassphraseError] = useState('');
            const [actionTarget, setActionTarget] = useState(''); 
            const [selectedItem, setSelectedItem] = useState(null); 
            const [isFormMode, setIsFormMode] = useState(false); 
            const [pageBarang, setPageBarang] = useState(1);
            const [searchTerm, setSearchTerm] = useState(''); 
            const [filterStatus, setFilterStatus] = useState('Aktif'); 
            const [formData, setFormData] = useState({});

            const filteredData = barangList.filter(item => 
                item.status === filterStatus &&
                (item.nama.toLowerCase().includes(searchTerm.toLowerCase()) || 
                 item.kode.toLowerCase().includes(searchTerm.toLowerCase()))
            );

            const itemsPerPage = 20;
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const currentData = filteredData.slice((pageBarang - 1) * itemsPerPage, pageBarang * itemsPerPage);

            const handleActionClick = (action, item = null) => {
                if (user.role === 'adminsuper' || user.role === 'pengurus') {
                    setActionTarget(action); setSelectedItem(item);
                    setPassphrase(''); setPassphraseError(''); setShowPassphraseModal(true);
                }
            };

            const submitPassphrase = () => {
                if (passphrase === appConfig.systemPassphrase) {
                    setShowPassphraseModal(false);
                    if (actionTarget === 'tambah') { 
                        setFormData({ cekFisik: 'Belum', foto: '', status: 'Aktif', keadaan: 'Baik', ruang: ruanganList[0]?.nama || '' }); 
                        setIsFormMode(true); 
                    } 
                    else if (actionTarget === 'edit') { 
                        setFormData(selectedItem); 
                        setIsFormMode(true); 
                    } 
                    else if (actionTarget === 'hapus') { 
                        setBarangList(prev => prev.map(b => b.id === selectedItem.id ? { ...b, status: 'Hapus' } : b));
                        alert(`Data barang ${selectedItem.nama} berhasil dipindahkan ke status Hapus.`); 
                    }
                } else setPassphraseError('Passphrase salah!');
            };

            const saveBarang = () => {
                if (actionTarget === 'edit') {
                    setBarangList(prev => prev.map(b => b.id === formData.id ? { ...b, ...formData } : b));
                } else {
                    const newId = barangList.length > 0 ? Math.max(...barangList.map(b=>b.id)) + 1 : 1;
                    setBarangList(prev => [...prev, { ...formData, id: newId, no: newId, register: String(newId).padStart(4, '0') }]);
                }
                setIsFormMode(false);
                alert('Data barang berhasil disimpan!');
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <h2 className="text-xl font-bold text-gray-800">{actionTarget === 'edit' ? 'Form Edit Data Barang' : 'Form Tambah Data Barang'}</h2>
                            <button onClick={() => setIsFormMode(false)} className="text-gray-500 hover:text-red-500 font-medium text-sm flex items-center">Kembali</button>
                        </div>
                        <form className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Kode Barang</label><input type="text" value={formData.kode || ''} onChange={e=>setFormData({...formData, kode: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">No Register</label><input type="text" value={formData.register || ''} onChange={e=>setFormData({...formData, register: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" readOnly={actionTarget === 'tambah'} placeholder={actionTarget==='tambah'?'Otomatis':''} /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Nama Barang</label><input type="text" value={formData.nama || ''} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Merk/Tipe</label><input type="text" value={formData.merk || ''} onChange={e=>setFormData({...formData, merk: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Tahun Beli</label><input type="number" value={formData.tahun || ''} onChange={e=>setFormData({...formData, tahun: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" /></div>
                            
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Keadaan</label>
                                <select value={formData.keadaan || 'Baik'} onChange={e=>setFormData({...formData, keadaan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500 bg-white"><option value="Baik">Baik</option><option value="Rusak Ringan">Rusak Ringan</option><option value="Rusak Berat">Rusak Berat</option></select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Ruangan</label>
                                <select value={formData.ruang || ''} onChange={e=>setFormData({...formData, ruang: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500 bg-white">
                                    <option value="">-- Pilih Ruangan --</option>
                                    {ruanganList.map(r => <option key={r.id} value={r.nama}>{r.nama}</option>)}
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Cek Fisik (Inventarisasi)</label>
                                <select value={formData.cekFisik || 'Belum'} onChange={e=>setFormData({...formData, cekFisik: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500 bg-white"><option value="Belum">Belum</option><option value="Sudah">Sudah</option></select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-1">Status Barang</label>
                                <select value={formData.status || 'Aktif'} onChange={e=>setFormData({...formData, status: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500 bg-white"><option value="Aktif">Aktif</option><option value="Hapus">Hapus</option></select>
                            </div>

                            <div className="md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Link URL Foto Terupdate</label>
                                <input type="text" value={formData.foto || ''} onChange={e=>setFormData({...formData, foto: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500" placeholder="https://..." />
                                {formData.foto && <div className="mt-2"><p className="text-xs text-gray-500 mb-1">Preview Gambar:</p><img src={formData.foto} alt="Preview" className="h-32 object-cover rounded border shadow-sm" onError={(e) => e.target.style.display = 'none'} /></div>}
                            </div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Keterangan Tambahan</label><textarea rows="2" value={formData.keterangan || ''} onChange={e=>setFormData({...formData, keterangan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-blue-500"></textarea></div>
                            
                            <div className="md:col-span-3 flex justify-end mt-4">
                                <button type="button" onClick={() => setIsFormMode(false)} className="bg-gray-200 text-gray-800 px-6 py-2 rounded-md mr-3 hover:bg-gray-300">Batal</button>
                                <button type="button" onClick={saveBarang} className="bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 shadow-lg">Simpan Data Barang</button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6 relative">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
                        <div className="flex gap-2">
                            {(user.role === 'adminsuper' || user.role === 'pengurus') && (
                                <button onClick={() => handleActionClick('tambah')} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium text-sm flex items-center transition">+ Tambah Barang</button>
                            )}
                        </div>
                        <div className="flex items-center gap-4 w-full md:w-auto">
                            <select value={filterStatus} onChange={(e) => {setFilterStatus(e.target.value); setPageBarang(1);}} className="border border-gray-300 text-sm rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50">
                                <option value="Aktif">Tampilkan: Barang Aktif</option>
                                <option value="Hapus">Tampilkan: Barang Dihapus</option>
                            </select>
                            <div className="relative w-full md:w-64">
                                <input type="text" placeholder="Cari barang / kode..." value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); setPageBarang(1);}} className="w-full pl-10 pr-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
                                <svg className="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                        </div>
                    </div>
                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 text-gray-700 text-sm"><th className="p-3 border-b">Kode Barang</th><th className="p-3 border-b">No Register</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Keadaan</th><th className="p-3 border-b">Cek Fisik</th><th className="p-3 border-b text-center">Aksi</th></tr></thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item) => (
                                    <tr key={item.id} className={`border-b border-gray-100 text-sm ${item.status === 'Hapus' ? 'bg-red-50' : 'hover:bg-gray-50'}`}>
                                        <td className="p-3 font-medium text-gray-800">{item.kode}</td><td className="p-3 text-gray-600">{item.register}</td><td className="p-3 text-gray-800">{item.nama}</td>
                                        <td className="p-3"><span className="px-2 py-1 rounded-full text-xs font-semibold bg-gray-200">{item.keadaan}</span></td>
                                        <td className="p-3"><span className={`px-2 py-1 rounded-full text-xs font-semibold ${item.cekFisik === 'Sudah' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{item.cekFisik}</span></td>
                                        <td className="p-3 text-center">
                                            {(user.role === 'adminsuper' || user.role === 'pengurus') && (
                                                <div className="flex justify-center space-x-2">
                                                    <button onClick={() => handleActionClick('edit', item)} className="text-blue-600 hover:bg-blue-100 p-1.5 rounded" title="Edit Barang"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                                    {item.status !== 'Hapus' && <button onClick={() => handleActionClick('hapus', item)} className="text-red-600 hover:bg-red-100 p-1.5 rounded" title="Hapus Barang"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>}
                                                </div>
                                            )}
                                        </td>
                                    </tr>
                                )) : <tr><td colSpan="6" className="p-4 text-center text-gray-500">Barang tidak ditemukan.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{filteredData.length > 0 ? (pageBarang - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pageBarang * itemsPerPage, filteredData.length)}</span> dari <span className="font-bold">{filteredData.length}</span> entri</p>
                        <div className="flex space-x-1">
                            <button onClick={() => setPageBarang(Math.max(1, pageBarang - 1))} disabled={pageBarang === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-blue-600 text-white rounded">{pageBarang}</span>
                            <button onClick={() => setPageBarang(Math.min(totalPages, pageBarang + 1))} disabled={pageBarang === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>
                    {showPassphraseModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-lg shadow-xl w-96 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Proteksi Aset - Otorisasi {actionTarget}</h3>
                                {passphraseError && <p className="text-xs text-red-500 mb-2">{passphraseError}</p>}
                                <input type="password" placeholder="Passphrase" value={passphrase} onChange={(e) => setPassphrase(e.target.value)} className="w-full px-3 py-2 border rounded-md mb-4 focus:ring-red-500" />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowPassphraseModal(false)} className="flex-1 bg-gray-200 py-2 rounded-md">Batal</button>
                                    <button onClick={submitPassphrase} className="flex-1 bg-red-600 text-white py-2 rounded-md">Verifikasi</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 5. KOMPONEN INVENTARIS (KIR)
        // ==========================================
        function Inventaris({ appConfig, ruanganList, barangList, setBarangList }) {
            const [selectedRuang, setSelectedRuang] = useState(ruanganList[0]?.nama || '');
            const [cameraModal, setCameraModal] = useState(null);
            const [pageInv, setPageInv] = useState(1);

            const filteredBarang = barangList.filter(b => b.status === 'Aktif' && b.ruang === selectedRuang);
            const itemsPerPage = 30;
            const totalPages = Math.ceil(filteredBarang.length / itemsPerPage);
            const currentData = filteredBarang.slice((pageInv - 1) * itemsPerPage, pageInv * itemsPerPage);

            const handleSimulateCamera = () => {
                const year = new Date().getFullYear();
                const item = cameraModal;
                let newFileName = '';
                let newUpdateCount = item.updateCount || 0;

                if (item.cekFisik === 'Belum') {
                    newFileName = `${item.kode.replace(/\./g, '')}_${item.register}_${year}.jpg`;
                } else {
                    newUpdateCount += 1;
                    newFileName = `${item.kode.replace(/\./g, '')}_${item.register}_${year}_updateke${newUpdateCount}.jpg`;
                }

                const fakeUrl = `https://dummyimage.com/600x400/0ea5e9/fff&text=${newFileName}`;
                setBarangList(prev => prev.map(b => b.id === item.id ? { ...b, cekFisik: 'Sudah', foto: fakeUrl, updateCount: newUpdateCount } : b));
                alert(`Foto berhasil diambil dan disimpan sebagai: ${newFileName}`);
                setCameraModal(null);
            };

            // Ganti fungsi exportKIR pada komponen Inventaris dengan kode berikut:
const exportKIR = (format) => {
    const dataRuangan = filteredBarang;
    if (dataRuangan.length === 0) return alert('Tidak ada barang di ruangan ini untuk di-export.');
    
    const roomInfo = ruanganList.find(r => r.nama === selectedRuang) || { pj: '-', jabatan: '-', nipPj: '-' };
    const today = new Date().toISOString().split('T')[0];

    if (format === 'PDF') {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        doc.setFontSize(14);
        doc.setFont("helvetica", "bold");
        doc.text("DAFTAR BARANG RUANGAN", 14, 15);
        
        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`Kota : Palangka Raya`, 14, 22);
        doc.text(`SOPD : ${appConfig.appName}`, 14, 27);
        doc.text(`Nama Ruangan : ${selectedRuang}`, 14, 32);
        
        const head = [["No", "Nama Barang", "Merk/Type", "Jumlah Barang", "Satuan", "Tahun Perolehan", "Kode Barang"]];
        const body = dataRuangan.map((b, i) => [i + 1, b.nama, b.merk, 1, 'unit', b.tahun, b.kode]);

        doc.autoTable({ 
            head: head, 
            body: body, 
            startY: 37, 
            styles: { fontSize: 8, cellPadding: 2 }, 
            headStyles: { fillColor: [30, 64, 175], halign: 'center' },
            columnStyles: { 
                0: { cellWidth: 10, halign: 'center' },
                3: { cellWidth: 22, halign: 'center' },
                4: { cellWidth: 15, halign: 'center' },
                5: { cellWidth: 20, halign: 'center' },
                6: { cellWidth: 25, halign: 'center' }
            }
        });

        let finalY = doc.lastAutoTable.finalY + 10;
        const pageHeight = doc.internal.pageSize.getHeight();
        const pageWidth = doc.internal.pageSize.getWidth();

        if (finalY + 55 > pageHeight) { 
            doc.addPage(); 
            finalY = 20; 
        }

        doc.setFontSize(9);
        doc.setFont("helvetica", "italic");
        doc.text("Catatan:", 14, finalY);
        doc.text("Tidak dibenarkan memindahkan barang-barang yang tercantum pada daftar ini tanpa sepengetahuan Penanggung Jawab.", 14, finalY + 5);

        finalY += 15;
        doc.setFontSize(9);
        doc.setFont("helvetica", "normal");
        
        const leftX = 14;
        const rightX = pageWidth - 14;

        // Baris 1: Tanggal & Mengetahui
        doc.text("Mengetahui,", leftX, finalY);
        doc.text(`Palangka Raya, ${formatDateID(today)}`, rightX, finalY, { align: 'right' });
        
        // Baris 2: Jabatan Pimpinan Kiri
        finalY += 5;
        const splitJabatanPimpinan = doc.splitTextToSize(appConfig.jabatanPimpinan, 85);
        doc.text(splitJabatanPimpinan, leftX, finalY);
        
        // Baris Jabatan Kanan (Penanggung Jawab dan Jabatan dirapatkan tanpa jeda berlebih)
        doc.text("Penanggung Jawab", rightX, finalY, { align: 'right' });
        doc.text(roomInfo.jabatan, rightX, finalY + 4, { align: 'right' });

        // Spasi Tanda Tangan
        finalY += Math.max((splitJabatanPimpinan.length * 4), 10) + 14;

        // Baris Nama & NIP
        doc.setFont("helvetica", "bold");
        doc.text(appConfig.namaPimpinan, leftX, finalY);
        doc.text(roomInfo.pj, rightX, finalY, { align: 'right' });

        doc.setFont("helvetica", "normal");
        doc.text(`NIP. ${appConfig.nipPimpinan}`, leftX, finalY + 5);
        doc.text(`NIP. ${roomInfo.nipPj}`, rightX, finalY + 5, { align: 'right' });

        doc.save(`KIR_${selectedRuang}.pdf`);
    } 
    else if (format === 'Excel') {
        const wsData = [
            ["DAFTAR BARANG RUANGAN"],
            [],
            ["Kota", ": Palangka Raya"],
            ["SOPD", `: ${appConfig.appName}`],
            ["Nama Ruangan", `: ${selectedRuang}`],
            [],
            ["No", "Nama Barang", "Merk/Type", "Jumlah Barang", "Satuan", "Tahun Perolehan", "Kode Barang"],
            ...dataRuangan.map((b, i) => [i + 1, b.nama, b.merk, 1, 'unit', b.tahun, b.kode]),
            [],
            ["Catatan:"],
            ["Tidak dibenarkan memindahkan barang-barang yang tercantum pada daftar ini tanpa sepengetahuan Penanggung Jawab."],
            [],
            ["Mengetahui,", "", "", "", "", "", `Palangka Raya, ${formatDateID(today)}`],
            [appConfig.jabatanPimpinan, "", "", "", "", "", "Penanggung Jawab"],
            ["", "", "", "", "", "", roomInfo.jabatan],
            [], [], [],
            [appConfig.namaPimpinan, "", "", "", "", "", roomInfo.pj],
            [`NIP. ${appConfig.nipPimpinan}`, "", "", "", "", "", `NIP. ${roomInfo.nipPj}`]
        ];
        
        const ws = XLSX.utils.aoa_to_sheet(wsData);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "KIR");
        XLSX.writeFile(wb, `KIR_${selectedRuang}.xlsx`);
    }
};

            return (
                <div className="bg-white rounded-lg shadow p-6 relative">
                    <div className="mb-6 flex flex-col md:flex-row gap-4 items-end border-b pb-4">
                        <div className="w-full md:w-1/3">
                            <label className="block text-sm font-bold text-gray-700 mb-2">Filter Data Ruangan (KIR)</label>
                            <select value={selectedRuang} onChange={(e) => {setSelectedRuang(e.target.value); setPageInv(1);}} className="w-full border-gray-300 border px-4 py-2.5 rounded-md focus:ring-blue-500 bg-gray-50 font-medium">
                                {ruanganList.map(r => <option key={r.id} value={r.nama}>{r.nama}</option>)}
                            </select>
                        </div>
                        <div className="flex-1 flex justify-end space-x-3 w-full md:w-auto mt-2 md:mt-0">
                            <button onClick={() => exportKIR('PDF')} className="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-md text-sm font-bold shadow-md transition flex items-center gap-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Cetak KIR (PDF)
                            </button>
                            <button onClick={() => exportKIR('Excel')} className="bg-green-600 hover:bg-green-700 text-white px-4 py-2.5 rounded-md text-sm font-bold shadow-md transition flex items-center gap-2">
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg> Cetak KIR (Excel)
                            </button>
                        </div>
                    </div>

                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-gray-700 text-sm">
                                    <th className="p-3 border-b">No</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Tahun</th><th className="p-3 border-b">Keterangan</th><th className="p-3 border-b text-center">Cek Fisik</th>
                                </tr>
                            </thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item, index) => (
                                    <tr key={item.id} className="hover:bg-gray-50 border-b border-gray-100 text-sm">
                                        <td className="p-3 font-medium text-gray-800">{(pageInv - 1) * itemsPerPage + index + 1}</td>
                                        <td className="p-3 text-gray-800 font-semibold">{item.nama}<br/><span className="text-xs font-normal text-gray-500">{item.kode} - {item.register}</span></td>
                                        <td className="p-3 text-gray-600">{item.tahun}</td>
                                        <td className="p-3 text-gray-600">{item.keterangan}</td>
                                        <td className="p-3 text-center">
                                            {item.cekFisik === 'Sudah' ? (
                                                <button onClick={() => setCameraModal(item)} className="px-3 py-1.5 text-xs font-bold text-blue-700 bg-blue-100 border border-blue-200 hover:bg-blue-200 rounded transition flex items-center justify-center mx-auto gap-1">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg> Sudah
                                                </button>
                                            ) : (
                                                <button onClick={() => setCameraModal(item)} className="px-3 py-1.5 text-xs font-bold text-red-700 bg-red-100 border border-red-200 hover:bg-red-200 rounded transition flex items-center justify-center mx-auto gap-1">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> Ambil Foto
                                                </button>
                                            )}
                                        </td>
                                    </tr>
                                )) : <tr><td colSpan="5" className="p-4 text-center text-gray-500">Tidak ada barang aktif di ruangan ini.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    
                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{filteredBarang.length > 0 ? (pageInv - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pageInv * itemsPerPage, filteredBarang.length)}</span> dari <span className="font-bold">{filteredBarang.length}</span> entri</p>
                        <div className="flex space-x-1">
                            <button onClick={() => setPageInv(Math.max(1, pageInv - 1))} disabled={pageInv === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-blue-600 text-white rounded">{pageInv}</span>
                            <button onClick={() => setPageInv(Math.min(totalPages, pageInv + 1))} disabled={pageInv === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>

                    {/* MODAL KAMERA */}
                    {cameraModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center backdrop-blur-sm p-4">
                            <div className="bg-gray-900 rounded-lg shadow-2xl max-w-lg w-full overflow-hidden border border-gray-700">
                                <div className="p-4 bg-gray-800 flex justify-between items-center text-white border-b border-gray-700"><h3 className="font-bold flex items-center gap-2"><svg className="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><circle cx="10" cy="10" r="3"/><path fillRule="evenodd" d="M4 8a6 6 0 0112 0v4a6 6 0 11-12 0V8zm2 0a4 4 0 118 0v4a4 4 0 11-8 0V8z" clipRule="evenodd"/></svg> Kamera Aktif</h3><button onClick={() => setCameraModal(null)} className="text-gray-400 hover:text-white">&times;</button></div>
                                <div className="h-64 bg-black flex items-center justify-center relative"><div className="absolute inset-0 border-2 border-white/20 m-4 rounded"></div><div className="w-16 h-16 border-t-2 border-l-2 border-white absolute top-6 left-6"></div><div className="w-16 h-16 border-b-2 border-r-2 border-white absolute bottom-6 right-6"></div><p className="text-gray-500 animate-pulse text-sm">Menampilkan Pratinjau Kamera...</p></div>
                                <div className="p-4 bg-gray-800 text-center">
                                    <p className="text-gray-300 text-sm mb-4">Target: <span className="font-bold text-white">{cameraModal.nama}</span></p>
                                    <button onClick={handleSimulateCamera} className="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full shadow-lg transition-transform transform hover:scale-105 flex items-center justify-center mx-auto gap-2">
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg> Jepret Foto Ruangan
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 6. KOMPONEN USUL PENGADAAN
        // ==========================================
        function Pengadaan({ user, pengadaanList, setPengadaanList }) {
            const [isFormMode, setIsFormMode] = useState(false);
            const [pagePg, setPagePg] = useState(1);
            const itemsPerPage = 30;
            
            const totalPages = Math.ceil(pengadaanList.length / itemsPerPage);
            const currentData = pengadaanList.slice((pagePg - 1) * itemsPerPage, pagePg * itemsPerPage);

            const [formData, setFormData] = useState({ tglUsul: new Date().toISOString().split('T')[0], namaBarang: '', jumlah: 1, estimasiHarga: '', peruntukan: '', pengusul: user.name, keterangan: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                const newNo = `PGD-${new Date().getFullYear()}-${String(pengadaanList.length + 1).padStart(4, '0')}`;
                setPengadaanList([{ ...formData, noUsulan: newNo, id: Date.now() }, ...pengadaanList]);
                setIsFormMode(false);
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8 max-w-3xl">
                        <div className="flex justify-between items-center mb-6 border-b pb-4"><h2 className="text-xl font-bold text-gray-800">Form Usulan Pengadaan Barang</h2><button onClick={() => setIsFormMode(false)} className="text-gray-500 hover:text-red-500 font-medium text-sm">Kembali</button></div>
                        <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="block text-sm font-medium mb-1">Tanggal Usulan</label><input type="date" value={formData.tglUsul} onChange={e=>setFormData({...formData, tglUsul: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div><label className="block text-sm font-medium mb-1">Nama Pengusul</label><input type="text" value={formData.pengusul} onChange={e=>setFormData({...formData, pengusul: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium mb-1">Nama Barang yang Diusulkan</label><input type="text" value={formData.namaBarang} onChange={e=>setFormData({...formData, namaBarang: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div><label className="block text-sm font-medium mb-1">Jumlah</label><input type="number" min="1" value={formData.jumlah} onChange={e=>setFormData({...formData, jumlah: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div><label className="block text-sm font-medium mb-1">Estimasi Harga Satuan (Rp)</label><input type="number" value={formData.estimasiHarga} onChange={e=>setFormData({...formData, estimasiHarga: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium mb-1">Peruntukan / Penempatan</label><input type="text" value={formData.peruntukan} onChange={e=>setFormData({...formData, peruntukan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required placeholder="Contoh: Ruang Tata Usaha" /></div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium mb-1">Keterangan / Alasan Kebutuhan</label><textarea rows="3" value={formData.keterangan} onChange={e=>setFormData({...formData, keterangan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required></textarea></div>
                            <div className="md:col-span-2 flex justify-end mt-4"><button type="submit" className="bg-teal-600 text-white px-6 py-2 rounded-md shadow hover:bg-teal-700">Simpan Usulan</button></div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex justify-between items-center mb-6">
                        <button onClick={() => { setIsFormMode(true); setFormData({...formData, tglUsul: new Date().toISOString().split('T')[0], namaBarang:'', jumlah:1, estimasiHarga:'', peruntukan:'', keterangan:''}) }} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-md font-medium text-sm">+ Buat Usulan Baru</button>
                    </div>
                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">No Usulan</th><th className="p-3 border-b">Tgl Usul</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Jml</th><th className="p-3 border-b">Estimasi Harga</th><th className="p-3 border-b">Peruntukan</th><th className="p-3 border-b">Pengusul</th></tr></thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item) => (
                                    <tr key={item.id} className="border-b border-gray-100 text-sm hover:bg-gray-50">
                                        <td className="p-3 font-semibold text-gray-800">{item.noUsulan}</td><td className="p-3 text-gray-600">{item.tglUsul}</td><td className="p-3 font-medium text-gray-800">{item.namaBarang}</td>
                                        <td className="p-3 text-gray-600">{item.jumlah}</td><td className="p-3 text-gray-600">{formatRupiah(item.estimasiHarga)}</td><td className="p-3 text-gray-600">{item.peruntukan}</td><td className="p-3 text-gray-600">{item.pengusul}</td>
                                    </tr>
                                )) : <tr><td colSpan="7" className="p-4 text-center text-gray-500">Belum ada data usulan pengadaan.</td></tr>}
                            </tbody>
                        </table>
                    </div>
                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{pengadaanList.length > 0 ? (pagePg - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pagePg * itemsPerPage, pengadaanList.length)}</span> dari <span className="font-bold">{pengadaanList.length}</span> entri</p>
                        <div className="flex space-x-1">
                            <button onClick={() => setPagePg(Math.max(1, pagePg - 1))} disabled={pagePg === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-teal-600 text-white rounded">{pagePg}</span>
                            <button onClick={() => setPagePg(Math.min(totalPages, pagePg + 1))} disabled={pagePg === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 7. KOMPONEN USUL PENGHAPUSAN
        // ==========================================
        function Penghapusan({ user, appConfig, barangList, setBarangList, usulanHapus, setUsulanHapus }) {
            const [viewMode, setViewMode] = useState('pilih'); 
            const [searchTerm, setSearchTerm] = useState('');
            const [pageView, setPageView] = useState(1);
            const [showPassModal, setShowPassModal] = useState(false);
            const [passInput, setPassInput] = useState('');
            const itemsPerPage = 30;

            const availableForHapus = barangList.filter(b => b.status === 'Aktif' && b.keadaan === 'Rusak Berat' && !usulanHapus.includes(b.id) && b.nama.toLowerCase().includes(searchTerm.toLowerCase()));
            const proposedForHapus = barangList.filter(b => usulanHapus.includes(b.id));

            const dataToDisplay = viewMode === 'pilih' ? availableForHapus : proposedForHapus;
            const totalPages = Math.ceil(dataToDisplay.length / itemsPerPage);
            const currentData = dataToDisplay.slice((pageView - 1) * itemsPerPage, pageView * itemsPerPage);

            const addToUsulan = (id) => { setUsulanHapus([...usulanHapus, id]); };
            const removeFromUsulan = (id) => { setUsulanHapus(usulanHapus.filter(uId => uId !== id)); };

            const submitHapus = () => {
                if(passInput === appConfig.systemPassphrase) {
                    setBarangList(prev => prev.map(b => usulanHapus.includes(b.id) ? { ...b, status: 'Hapus' } : b));
                    setUsulanHapus([]);
                    setShowPassModal(false);
                    setPassInput('');
                    alert('Proses berhasil: Seluruh barang dalam daftar usulan telah diset status menjadi HAPUS.');
                    setViewMode('pilih');
                } else {
                    alert('Passphrase salah!');
                }
            };

            const cetakDaftar = (format) => {
                if(proposedForHapus.length === 0) return alert('Daftar usulan masih kosong.');
                const exportData = proposedForHapus.map(b => ({ 'Kode': b.kode, 'Register': b.register, 'Nama Barang': b.nama, 'Merk': b.merk, 'Tahun': b.tahun, 'Ruang': b.ruang }));
                
                if (format === 'PDF') {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    doc.setFontSize(14); doc.text(`Daftar Usulan Penghapusan Aset`, 14, 15);
                    doc.autoTable({ head: [Object.keys(exportData[0])], body: exportData.map(obj => Object.values(obj)), startY: 25, styles: { fontSize: 8 } });
                    doc.save(`Usulan_Penghapusan.pdf`);
                } else if (format === 'Excel') {
                    const ws = XLSX.utils.json_to_sheet(exportData);
                    const wb = XLSX.utils.book_new();
                    XLSX.utils.book_append_sheet(wb, ws, "UsulanHapus");
                    XLSX.writeFile(wb, `Usulan_Penghapusan.xlsx`);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow p-6 relative">
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4 border-b pb-4">
                        <div className="flex space-x-2">
                            <button onClick={() => {setViewMode('pilih'); setPageView(1);}} className={`px-4 py-2 rounded-md font-medium text-sm transition ${viewMode === 'pilih' ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>Pilih Barang Rusak</button>
                            <button onClick={() => {setViewMode('daftar'); setPageView(1);}} className={`px-4 py-2 rounded-md font-medium text-sm transition flex items-center gap-2 ${viewMode === 'daftar' ? 'bg-red-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}>
                                Daftar Usul Hapus <span className="bg-white text-red-600 px-2 rounded-full text-xs font-bold">{usulanHapus.length}</span>
                            </button>
                        </div>
                        
                        {viewMode === 'pilih' && (
                            <div className="relative w-full md:w-64">
                                <input type="text" placeholder="Cari nama barang..." value={searchTerm} onChange={(e) => {setSearchTerm(e.target.value); setPageView(1);}} className="w-full pl-10 pr-4 py-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-red-500" />
                                <svg className="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                        )}

                        {viewMode === 'daftar' && (
                            <div className="flex space-x-2">
                                <button onClick={()=>cetakDaftar('PDF')} className="bg-gray-600 text-white px-3 py-2 rounded text-sm hover:bg-gray-700">PDF</button>
                                <button onClick={()=>cetakDaftar('Excel')} className="bg-green-600 text-white px-3 py-2 rounded text-sm hover:bg-green-700">Excel</button>
                                {(user.role === 'adminsuper' || user.role === 'pengurus') && usulanHapus.length > 0 && (
                                    <button onClick={() => {setPassInput(''); setShowPassModal(true);}} className="bg-red-600 text-white px-4 py-2 rounded font-bold text-sm shadow hover:bg-red-700">Usul Hapus Diterima BKAD</button>
                                )}
                            </div>
                        )}
                    </div>

                    <div className="overflow-x-auto min-h-[400px]">
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-gray-100 text-sm">
                                    <th className="p-3 border-b">Kode / Register</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Merk / Tahun</th><th className="p-3 border-b">Ruangan</th><th className="p-3 border-b text-center">Ajuan</th>
                                </tr>
                            </thead>
                            <tbody>
                                {currentData.length > 0 ? currentData.map((item) => (
                                    <tr key={item.id} className="border-b border-gray-100 text-sm hover:bg-gray-50">
                                        <td className="p-3 text-gray-600 font-medium">{item.kode}<br/>{item.register}</td>
                                        <td className="p-3 text-gray-800 font-bold">{item.nama}</td>
                                        <td className="p-3 text-gray-600">{item.merk} / {item.tahun}</td>
                                        <td className="p-3 text-gray-600">{item.ruang}</td>
                                        <td className="p-3 text-center">
                                            {viewMode === 'pilih' ? (
                                                <button onClick={() => addToUsulan(item.id)} className="bg-red-100 text-red-700 hover:bg-red-200 px-3 py-1 rounded text-xs font-bold">+ Tambah</button>
                                            ) : (
                                                <button onClick={() => removeFromUsulan(item.id)} className="bg-gray-200 text-gray-700 hover:bg-gray-300 px-3 py-1 rounded text-xs font-bold">Batal Hapus</button>
                                            )}
                                        </td>
                                    </tr>
                                )) : <tr><td colSpan="5" className="p-4 text-center text-gray-500">{viewMode === 'pilih' ? 'Tidak ada barang rusak berat yang tersedia.' : 'Daftar usulan masih kosong.'}</td></tr>}
                            </tbody>
                        </table>
                    </div>

                    <div className="flex justify-between items-center mt-4 text-sm text-gray-600 border-t pt-4">
                        <p>Menampilkan <span className="font-bold">{dataToDisplay.length > 0 ? (pageView - 1) * itemsPerPage + 1 : 0}</span> hingga <span className="font-bold">{Math.min(pageView * itemsPerPage, dataToDisplay.length)}</span> dari <span className="font-bold">{dataToDisplay.length}</span> entri</p>
                        <div className="flex space-x-1">
                            <button onClick={() => setPageView(Math.max(1, pageView - 1))} disabled={pageView === 1} className="px-3 py-1 border rounded hover:bg-gray-100">Seb</button>
                            <span className="px-3 py-1 bg-red-600 text-white rounded">{pageView}</span>
                            <button onClick={() => setPageView(Math.min(totalPages, pageView + 1))} disabled={pageView === totalPages || totalPages === 0} className="px-3 py-1 border rounded hover:bg-gray-100">Sel</button>
                        </div>
                    </div>

                    {showPassModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-lg shadow-xl w-96 transform transition-all">
                                <h3 className="text-lg font-bold text-gray-900 mb-2">Otorisasi Penghapusan Final</h3>
                                <p className="text-xs text-gray-600 mb-4">Aksi ini akan menghapus permanen {usulanHapus.length} barang dari sistem inventaris aktif.</p>
                                <input type="password" placeholder="Passphrase" value={passInput} onChange={(e) => setPassInput(e.target.value)} className="w-full px-3 py-2 border rounded-md mb-4 focus:ring-red-500" />
                                <div className="flex space-x-3">
                                    <button onClick={() => setShowPassModal(false)} className="flex-1 bg-gray-200 py-2 rounded-md">Batal</button>
                                    <button onClick={submitHapus} className="flex-1 bg-red-600 text-white py-2 rounded-md">Eksekusi Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 8. KOMPONEN RUANGAN (DENGAN NIP PJ)
        // ==========================================
        function Ruangan({ ruanganList, setRuanganList, user }) {
            const [isFormMode, setIsFormMode] = useState(false);
            const [editingId, setEditingId] = useState(null);
            const [formData, setFormData] = useState({ nama: '', pj: '', jabatan: '', nipPj: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                if (editingId) {
                    setRuanganList(prev => prev.map(r => r.id === editingId ? { ...r, ...formData } : r));
                } else {
                    const newId = Math.max(...ruanganList.map(r => r.id)) + 1;
                    const newNo = `R-${String(newId).padStart(3, '0')}`;
                    setRuanganList(prev => [...prev, { id: newId, no: newNo, ...formData }]);
                }
                setIsFormMode(false); setEditingId(null);
            };

            const openEdit = (item) => {
                setEditingId(item.id); setFormData({ nama: item.nama, pj: item.pj, jabatan: item.jabatan, nipPj: item.nipPj || '' }); setIsFormMode(true);
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8 max-w-2xl">
                        <h2 className="text-xl font-bold mb-6 border-b pb-4">{editingId ? 'Edit Data Ruangan' : 'Tambah Ruangan Baru'}</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm font-medium mb-1">Nama Ruangan</label><input type="text" value={formData.nama} onChange={e=>setFormData({...formData, nama:e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div><label className="block text-sm font-medium mb-1">Nama Penanggung Jawab</label><input type="text" value={formData.pj} onChange={e=>setFormData({...formData, pj:e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div><label className="block text-sm font-medium mb-1">NIP Penanggung Jawab</label><input type="text" value={formData.nipPj} onChange={e=>setFormData({...formData, nipPj:e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" placeholder="1980... (Opsional)" /></div>
                                <div><label className="block text-sm font-medium mb-1">Jabatan</label><input type="text" value={formData.jabatan} onChange={e=>setFormData({...formData, jabatan:e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-teal-500" required /></div>
                            </div>
                            <div className="flex justify-end space-x-3 pt-4">
                                <button type="button" onClick={() => setIsFormMode(false)} className="px-4 py-2 bg-gray-200 rounded-md">Batal</button>
                                <button type="submit" className="px-4 py-2 bg-teal-600 text-white rounded-md">Simpan Data</button>
                            </div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex justify-between items-center mb-6">
                        {(user.role === 'adminsuper' || user.role === 'pengurus') && (
                            <button onClick={() => { setIsFormMode(true); setEditingId(null); setFormData({ nama:'', pj:'', jabatan:'', nipPj:'' }); }} className="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-md font-medium text-sm">+ Tambah Ruangan</button>
                        )}
                    </div>
                    <div className="overflow-x-auto">
                        <table className="w-full text-left border-collapse">
                            <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">No Ruang</th><th className="p-3 border-b">Nama Ruangan</th><th className="p-3 border-b">Penanggung Jawab</th><th className="p-3 border-b">Jabatan</th><th className="p-3 border-b text-center">Aksi</th></tr></thead>
                            <tbody>
                                {ruanganList.map((r) => (
                                    <tr key={r.id} className="border-b border-gray-100 text-sm hover:bg-gray-50">
                                        <td className="p-3 text-gray-600">{r.no}</td><td className="p-3 font-semibold text-gray-800">{r.nama}</td>
                                        <td className="p-3 text-gray-800 font-medium">{r.pj}<br/><span className="text-xs text-gray-500 font-normal">NIP: {r.nipPj || '-'}</span></td>
                                        <td className="p-3 text-gray-600">{r.jabatan}</td>
                                        <td className="p-3 text-center">
                                            {(user.role === 'adminsuper' || user.role === 'pengurus') && (
                                                <button onClick={() => openEdit(r)} className="text-teal-600 hover:text-teal-800 bg-teal-50 p-2 rounded-full"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg></button>
                                            )}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 9. KOMPONEN PEMELIHARAAN
        // ==========================================
        function Pemeliharaan({ user, navParams, barangList, pemeliharaanList, setPemeliharaanList, setAduanList }) {
            const [isFormMode, setIsFormMode] = useState(!!navParams?.kode);
            const [editingId, setEditingId] = useState(null); 
            const [searchKeyword, setSearchKeyword] = useState(navParams?.nama || '');
            const [searchResults, setSearchResults] = useState([]);
            const [showDropdown, setShowDropdown] = useState(false);
            const [statusFilter, setStatusFilter] = useState('');
            const [pagePem, setPagePem] = useState(1);
            
            const [formData, setFormData] = useState({
                kode: navParams?.kode || '', register: navParams?.register || '',
                tanggal: new Date().toISOString().split('T')[0], jenis: 'Perbaikan Kerusakan',
                kegiatan: navParams?.deskripsiAduan || '', status: 'Proses', aduanId: navParams?.aduanId || null
            });

            useEffect(() => {
                if (navParams?.kode) {
                    setIsFormMode(true); setEditingId(null); setSearchKeyword(navParams.nama);
                    setFormData({ kode: navParams.kode, register: navParams.register, tanggal: new Date().toISOString().split('T')[0], jenis: 'Perbaikan Kerusakan', kegiatan: navParams.deskripsiAduan, status: 'Proses', aduanId: navParams.aduanId });
                }
            }, [navParams]);

            const handleSearchChange = (e) => {
                const keyword = e.target.value; setSearchKeyword(keyword);
                if (keyword.length > 1) {
                    const results = barangList.filter(b => b.status === 'Aktif' && (b.nama.toLowerCase().includes(keyword.toLowerCase()) || b.merk.toLowerCase().includes(keyword.toLowerCase())));
                    setSearchResults(results); setShowDropdown(true);
                } else setShowDropdown(false);
            };

            const handleSelectBarang = (barang) => {
                setSearchKeyword(barang.nama); setFormData({ ...formData, kode: barang.kode, register: barang.register }); setShowDropdown(false);
            };

            const handleBlur = () => setTimeout(() => setShowDropdown(false), 200);

            const submitPemeliharaan = () => {
                if (!formData.kode || !formData.kegiatan) { alert('Mohon lengkapi form.'); return; }
                if (formData.aduanId) {
                    setAduanList(prev => prev.map(a => a.id === formData.aduanId ? { ...a, status: formData.status } : a));
                }
                if (editingId) {
                    setPemeliharaanList(prev => prev.map(p => p.id === editingId ? { ...p, ...formData, namaBarang: searchKeyword } : p));
                    alert('Data pemeliharaan (dan aduan terkait) berhasil diperbarui!');
                } else {
                    const newData = { id: Date.now(), namaBarang: searchKeyword, ...formData };
                    setPemeliharaanList(prev => [newData, ...prev]);
                    alert('Pemeliharaan baru berhasil dicatat!');
                }
                setIsFormMode(false); setEditingId(null);
                setFormData({ kode: '', register: '', tanggal: '', jenis: 'Perbaikan Kerusakan', kegiatan: '', status: 'Proses', aduanId: null });
                setSearchKeyword('');
            };

            const openEditForm = (item) => {
                setEditingId(item.id); setSearchKeyword(item.namaBarang);
                setFormData({ kode: item.kode, register: item.register, tanggal: item.tanggal, jenis: item.jenis, kegiatan: item.kegiatan, status: item.status, aduanId: item.aduanId });
                setIsFormMode(true);
            };

            const filteredPemeliharaan = pemeliharaanList.filter(item => statusFilter === '' || item.status === statusFilter);
            const itemsPerPage = 20;
            const totalPages = Math.ceil(filteredPemeliharaan.length / itemsPerPage);
            const currentData = filteredPemeliharaan.slice((pagePem - 1) * itemsPerPage, pagePem * itemsPerPage);

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8 border-l-4 border-indigo-500">
                        <div className="flex justify-between items-center mb-6 border-b pb-4">
                            <div>
                                <h2 className="text-xl font-bold text-gray-800">{editingId ? 'Edit Data Pemeliharaan' : 'Form Catat Pemeliharaan'}</h2>
                                {formData.aduanId && <p className="text-sm text-indigo-600 font-medium mt-1">Terhubung dengan ID Aduan: #{formData.aduanId}</p>}
                            </div>
                            <button onClick={() => { setIsFormMode(false); setEditingId(null); }} className="text-gray-500 hover:text-red-500 font-medium text-sm">Kembali</button>
                        </div>
                        <form className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="relative md:col-span-2">
                                <label className="block text-sm font-medium text-gray-700 mb-1">Cari Barang yang Dipelihara</label>
                                <input type="text" value={searchKeyword} onChange={handleSearchChange} onBlur={handleBlur} className={`w-full border px-3 py-2 rounded-md shadow-sm ${(formData.aduanId || editingId) ? 'bg-indigo-50 font-semibold' : 'focus:ring-indigo-500'}`} autoComplete="off" />
                                {showDropdown && searchResults.length > 0 && (
                                    <ul className="absolute z-20 w-full bg-white border mt-1 max-h-56 overflow-y-auto shadow-xl rounded-md divide-y">
                                        {searchResults.map((b) => (<li key={b.id} onClick={() => handleSelectBarang(b)} className="p-3 hover:bg-indigo-50 cursor-pointer transition"><div className="font-bold text-sm">{b.nama}</div><div className="text-xs text-gray-500 mt-0.5">Merk: {b.merk} • Tahun: {b.tahun} • Ruang: {b.ruang}</div><div className="text-xs text-blue-600 mt-1 italic">Ket: {b.keterangan}</div></li>))}
                                    </ul>
                                )}
                            </div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Kode Barang</label><input type="text" value={formData.kode} className="w-full border px-3 py-2 rounded-md bg-gray-100" readOnly /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">No Register</label><input type="text" value={formData.register} className="w-full border px-3 py-2 rounded-md bg-gray-100" readOnly /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Tanggal Pemeliharaan</label><input type="date" value={formData.tanggal} onChange={(e) => setFormData({...formData, tanggal: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-indigo-500" /></div>
                            <div><label className="block text-sm font-medium text-gray-700 mb-1">Jenis Pemeliharaan</label>
                                <select value={formData.jenis} onChange={(e) => setFormData({...formData, jenis: e.target.value})} className="w-full border px-3 py-2 rounded-md bg-white">
                                    <option value="Perbaikan Kerusakan">Perbaikan Kerusakan</option><option value="Rutin">Rutin</option><option value="Ganti Suku Cadang">Ganti Suku Cadang</option>
                                </select>
                            </div>
                            <div className="md:col-span-2"><label className="block text-sm font-medium text-gray-700 mb-1">Kegiatan Perbaikan (Analisa)</label><textarea rows="3" value={formData.kegiatan} onChange={(e)=>setFormData({...formData, kegiatan: e.target.value})} className="w-full border px-3 py-2 rounded-md focus:ring-indigo-500"></textarea></div>
