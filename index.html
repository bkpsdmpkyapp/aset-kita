<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aset Kita - Sistem Informasi Inventaris</title>
    
    <!-- Library CSS & React -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Library Grafik & Export Dokumen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        @media print {
            aside, header, .no-print { display: none !important; }
            main { padding: 0 !important; background: white !important; }
            .shadow-lg { box-shadow: none !important; }
            .page-break { page-break-after: always; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 20px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // 0. INISIALISASI DATABASE FIREBASE
        // ==========================================
// import { initializeApp } from "firebase/app";
        // PASTE-KAN CONFIG FIREBASE ANDA DI SINI
       const firebaseConfig = {
  apiKey: "AIzaSyAd3hkGBk4zlncEPGN7Mm_pigF_C7yPBnA",
  authDomain: "aset-kita-db.firebaseapp.com",
  projectId: "aset-kita-db",
  storageBucket: "aset-kita-db.firebasestorage.app",
  messagingSenderId: "202167885902",
  appId: "1:202167885902:web:807249150c451823a8a31f"
};
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        const getStatusColor = (status) => {
            switch(status) {
                case 'Menunggu': return 'bg-blue-100 text-blue-700';
                case 'Proses': return 'bg-yellow-100 text-yellow-700';
                case 'Selesai': return 'bg-green-100 text-green-700';
                case 'Tertunda': return 'bg-gray-200 text-gray-700';
                case 'Usul Hapus': return 'bg-red-100 text-red-700';
                default: return 'bg-gray-100 text-gray-700';
            }
        };
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        const formatDateID = (dateStr) => new Date(dateStr).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });

        // ==========================================
        // 1. KOMPONEN LOGIN
        // ==========================================
        function Login({ onLogin }) {
            const [username, setUsername] = useState('admin1');
            const [password, setPassword] = useState('123');
            const [error, setError] = useState('');

            const handleLogin = (e) => {
                e.preventDefault();
                setError('');
                if (username === 'admin1' && password === '123') onLogin({ username: 'admin1', role: 'adminsuper', name: 'Admin Super' });
                else if (username === 'pegawai1' && password === '123') onLogin({ username: 'pegawai1', role: 'pegawai', name: 'Pegawai Biasa' });
                else if (username === 'pengurus1' && password === '123') onLogin({ username: 'pengurus1', role: 'pengurus', name: 'Pengurus Aset' });
                else setError('Username atau password salah!');
            };

            return (
                <div className="h-screen flex items-center justify-center bg-gray-900/50 bg-cover bg-center" style={{ backgroundImage: "url('https://images.unsplash.com/photo-1497366216548-37526070297c?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80')" }}>
                    <div className="bg-white/95 backdrop-blur-md rounded-lg shadow-2xl p-10 w-full max-w-md">
                        <div className="text-center mb-8">
                            <div className="flex justify-center items-center gap-2 mb-2"><svg className="w-10 h-10 text-blue-600" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><h1 className="text-3xl font-bold text-gray-800">Aset Kita</h1></div>
                            <p className="text-sm font-semibold text-gray-500 uppercase tracking-wide">Masuk Ke Sistem</p>
                        </div>
                        {error && <div className="mb-4 p-3 bg-red-100 text-red-700 rounded text-sm text-center font-medium">{error}</div>}
                        <form onSubmit={handleLogin}>
                            <div className="mb-4"><input type="text" placeholder="Username (admin1/pegawai1/pengurus1)" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full px-4 py-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required /></div>
                            <div className="mb-6"><input type="password" placeholder="Kata Sandi (123)" value={password} onChange={(e) => setPassword(e.target.value)} className="w-full px-4 py-3 rounded-md border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500" required /></div>
                            <button type="submit" className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200">Masuk</button>
                        </form>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 2. KOMPONEN LAYOUT
        // ==========================================
        function Layout({ children, user, currentPage, onNavigate, onLogout }) {
            const [showDropdown, setShowDropdown] = useState(false);
            const dropdownRef = useRef(null);

            const navItems = [
                { id: 'dashboard', label: 'Dashboard' }, { id: 'databarang', label: 'Data Barang' }, { id: 'inventaris', label: 'Inventaris Barang' }, 
                { id: 'pengadaan', label: 'Usul Pengadaan' }, { id: 'penghapusan', label: 'Usul Penghapusan' }, { id: 'ruangan', label: 'Ruangan' },
                { id: 'pemeliharaan', label: 'Pemeliharaan' }, { id: 'aduan', label: 'Aduan' }, 
                ...(user.role !== 'pegawai' ? [{ id: 'laporan', label: 'Laporan' }, { id: 'pengaturan', label: 'Pengaturan' }] : [])
            ];

            useEffect(() => {
                const handleClickOutside = (e) => { if (dropdownRef.current && !dropdownRef.current.contains(e.target)) setShowDropdown(false); };
                document.addEventListener('mousedown', handleClickOutside);
                return () => document.removeEventListener('mousedown', handleClickOutside);
            }, []);

            return (
                <div className="bg-gray-100 flex h-screen overflow-hidden">
                    <aside className="w-64 bg-[#1e293b] text-white flex flex-col z-20 shadow-xl no-print">
                        <div className="h-16 flex items-center px-6 border-b border-gray-700"><svg className="w-8 h-8 text-blue-400 mr-2" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg><span className="text-xl font-bold">Aset Kita</span></div>
                        <div className="px-6 py-4 border-b border-gray-700"><p className="text-xs text-gray-400 uppercase tracking-wider">Login sebagai:</p><p className="font-semibold text-blue-400 capitalize">{user.role}</p></div>
                        <nav className="flex-1 px-4 py-4 space-y-1 overflow-y-auto custom-scrollbar">
                            {navItems.map(item => (<button key={item.id} onClick={() => onNavigate(item.id)} className={`w-full flex items-center px-4 py-2.5 rounded-md font-medium text-left transition-colors ${currentPage === item.id ? 'bg-blue-600/20 text-blue-400' : 'text-gray-300 hover:bg-gray-800'}`}>{item.label}</button>))}
                        </nav>
                    </aside>
                    <div className="flex-1 flex flex-col h-screen overflow-hidden">
                        <header className="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10 no-print">
                            <h2 className="font-semibold text-lg text-gray-800 capitalize">{currentPage.replace(/([A-Z])/g, ' $1').trim()}</h2>
                            <div className="relative" ref={dropdownRef}>
                                <div onClick={() => setShowDropdown(!showDropdown)} className="flex items-center space-x-3 cursor-pointer hover:bg-gray-50 p-2 rounded-lg transition">
                                    <span className="text-sm font-medium text-gray-700">{user.name}</span>
                                    <div className="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold shadow">{user.name.charAt(0)}</div>
                                </div>
                                {showDropdown && (
                                    <div className="absolute right-0 mt-2 w-48 bg-white border border-gray-100 rounded-md shadow-xl py-1 z-50">
                                        <button onClick={() => { onNavigate('profil'); setShowDropdown(false); }} className="w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 flex items-center">Profil Saya</button>
                                        <div className="border-t border-gray-100 my-1"></div>
                                        <button onClick={() => { onLogout(); setShowDropdown(false); }} className="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center">Keluar</button>
                                    </div>
                                )}
                            </div>
                        </header>
                        <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">{children}</main>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. KOMPONEN DASHBOARD
        // ==========================================
        function Dashboard() {
            return (
                <div>
                    <h2 className="text-2xl font-bold mb-4 text-gray-800">Dashboard Overview</h2>
                    <div className="flex flex-col lg:flex-row gap-6">
                        <div className="w-full lg:w-1/3 space-y-6">
                            <div className="bg-cyan-600 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Total Barang Aktif</p><p className="text-3xl font-bold mt-2">1,254</p></div>
                            <div className="bg-green-500 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Kondisi Baik</p><p className="text-3xl font-bold mt-2">1,020</p></div>
                            <div className="bg-yellow-500 rounded-lg shadow p-6 text-white"><p className="text-sm font-medium uppercase opacity-80">Rusak Ringan/Berat</p><div className="flex gap-4 mt-2"><p className="text-2xl font-bold">180 <span className="text-sm font-normal">Ringan</span></p><p className="text-2xl font-bold">54 <span className="text-sm font-normal">Berat</span></p></div></div>
                        </div>
                        <div className="w-full lg:w-2/3 bg-white rounded-lg shadow p-6 flex items-center justify-center">
                            <div className="text-center text-gray-500">
                                <svg className="w-16 h-16 mx-auto text-gray-300 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                                <p>Sistem Aktif & Terhubung ke Firebase</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. KOMPONEN DATA BARANG
        // ==========================================
        function DataBarang({ user, appConfig, ruanganList, barangList, setBarangList }) {
            const [showPassphraseModal, setShowPassphraseModal] = useState(false);
            const [passphrase, setPassphrase] = useState('');
            const [actionTarget, setActionTarget] = useState(''); 
            const [selectedItem, setSelectedItem] = useState(null); 
            const [isFormMode, setIsFormMode] = useState(false); 
            const [pageBarang, setPageBarang] = useState(1);
            const [searchTerm, setSearchTerm] = useState(''); 
            const [filterStatus, setFilterStatus] = useState('Aktif'); 
            const [formData, setFormData] = useState({});

            const filteredData = barangList.filter(item => item.status === filterStatus && (item.nama.toLowerCase().includes(searchTerm.toLowerCase()) || item.kode.toLowerCase().includes(searchTerm.toLowerCase())));
            const itemsPerPage = 20;
            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            const currentData = filteredData.slice((pageBarang - 1) * itemsPerPage, pageBarang * itemsPerPage);

            const handleActionClick = (action, item = null) => {
                if (user.role === 'adminsuper' || user.role === 'pengurus') { setActionTarget(action); setSelectedItem(item); setPassphrase(''); setShowPassphraseModal(true); }
            };

            const submitPassphrase = () => {
                if (passphrase === appConfig.systemPassphrase) {
                    setShowPassphraseModal(false);
                    if (actionTarget === 'tambah') { setFormData({ cekFisik: 'Belum', status: 'Aktif', keadaan: 'Baik', ruang: ruanganList[0]?.nama || '' }); setIsFormMode(true); } 
                    else if (actionTarget === 'edit') { setFormData(selectedItem); setIsFormMode(true); } 
                    else if (actionTarget === 'hapus') { setBarangList(prev => prev.map(b => b.id === selectedItem.id ? { ...b, status: 'Hapus' } : b)); }
                } else alert('Passphrase salah!');
            };

            const saveBarang = () => {
                if (actionTarget === 'edit') { setBarangList(prev => prev.map(b => b.id === formData.id ? { ...b, ...formData } : b)); } 
                else {
                    const newId = barangList.length > 0 ? Math.max(...barangList.map(b=>b.id)) + 1 : 1;
                    setBarangList(prev => [...prev, { ...formData, id: newId, no: newId, register: String(newId).padStart(4, '0') }]);
                }
                setIsFormMode(false);
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-8">
                        <div className="flex justify-between border-b pb-4 mb-4"><h2 className="text-xl font-bold">{actionTarget === 'edit' ? 'Edit Barang' : 'Tambah Barang'}</h2><button onClick={() => setIsFormMode(false)} className="text-red-500">Batal</button></div>
                        <form className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                            <div><label className="block text-sm mb-1">Kode Barang</label><input type="text" value={formData.kode || ''} onChange={e=>setFormData({...formData, kode: e.target.value})} className="w-full border px-3 py-2 rounded-md" /></div>
                            <div><label className="block text-sm mb-1">Nama Barang</label><input type="text" value={formData.nama || ''} onChange={e=>setFormData({...formData, nama: e.target.value})} className="w-full border px-3 py-2 rounded-md" /></div>
                            <div><label className="block text-sm mb-1">Ruangan</label><select value={formData.ruang || ''} onChange={e=>setFormData({...formData, ruang: e.target.value})} className="w-full border px-3 py-2 rounded-md"><option value="">-- Pilih --</option>{ruanganList.map(r => <option key={r.id} value={r.nama}>{r.nama}</option>)}</select></div>
                            <div className="md:col-span-3 flex justify-end mt-4"><button type="button" onClick={saveBarang} className="bg-blue-600 text-white px-6 py-2 rounded-md">Simpan Data</button></div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex justify-between items-center mb-6">
                        {(user.role === 'adminsuper' || user.role === 'pengurus') && <button onClick={() => handleActionClick('tambah')} className="bg-blue-600 text-white px-4 py-2 rounded-md">+ Tambah Barang</button>}
                        <div className="flex gap-2">
                            <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} className="border rounded-md px-3 py-2"><option value="Aktif">Aktif</option><option value="Hapus">Dihapus</option></select>
                            <input type="text" placeholder="Cari..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} className="border rounded-md px-3 py-2" />
                        </div>
                    </div>
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Kode / Reg</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Keadaan</th><th className="p-3 border-b text-center">Aksi</th></tr></thead>
                        <tbody>
                            {currentData.map(item => (
                                <tr key={item.id} className="border-b text-sm">
                                    <td className="p-3">{item.kode} / {item.register}</td><td className="p-3">{item.nama}</td><td className="p-3">{item.keadaan}</td>
                                    <td className="p-3 text-center">
                                        {(user.role === 'adminsuper' || user.role === 'pengurus') && (
                                            <div className="flex justify-center space-x-2">
                                                <button onClick={() => handleActionClick('edit', item)} className="text-blue-600 bg-blue-50 p-1 rounded">Edit</button>
                                                {item.status !== 'Hapus' && <button onClick={() => handleActionClick('hapus', item)} className="text-red-600 bg-red-50 p-1 rounded">Hapus</button>}
                                            </div>
                                        )}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                    
                    {showPassphraseModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center">
                            <div className="bg-white p-6 rounded-lg w-96"><h3 className="font-bold mb-4">Otorisasi {actionTarget}</h3><input type="password" placeholder="Passphrase" value={passphrase} onChange={(e) => setPassphrase(e.target.value)} className="w-full border px-3 py-2 mb-4 rounded" /><div className="flex gap-2"><button onClick={() => setShowPassphraseModal(false)} className="flex-1 bg-gray-200 py-2 rounded">Batal</button><button onClick={submitPassphrase} className="flex-1 bg-red-600 text-white py-2 rounded">Verifikasi</button></div></div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // 5. KOMPONEN INVENTARIS (KIR)
        // ==========================================
        function Inventaris({ appConfig, ruanganList, barangList, setBarangList }) {
            const [selectedRuang, setSelectedRuang] = useState(ruanganList[0]?.nama || '');
            const filteredBarang = barangList.filter(b => b.status === 'Aktif' && b.ruang === selectedRuang);

            const exportKIR = (format) => {
                const dataRuangan = filteredBarang;
                if (dataRuangan.length === 0) return alert('Tidak ada barang di ruangan ini.');
                const roomInfo = ruanganList.find(r => r.nama === selectedRuang) || { pj: '-', jabatan: '-', nipPj: '-' };
                const today = new Date().toISOString().split('T')[0];

                if (format === 'PDF') {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();
                    
                    doc.setFontSize(14); doc.setFont("helvetica", "bold"); doc.text("DAFTAR BARANG RUANGAN", 14, 15);
                    doc.setFontSize(10); doc.setFont("helvetica", "normal");
                    doc.text(`Kota : Palangka Raya`, 14, 22); doc.text(`SOPD : ${appConfig.appName}`, 14, 27); doc.text(`Nama Ruangan : ${selectedRuang}`, 14, 32);
                    
                    const head = [["No", "Nama Barang", "Merk/Type", "Jumlah", "Satuan", "Tahun", "Kode Barang"]];
                    const body = dataRuangan.map((b, i) => [i + 1, b.nama, b.merk, 1, 'unit', b.tahun, b.kode]);

                    doc.autoTable({ head, body, startY: 37, styles: { fontSize: 8 }, headStyles: { fillColor: [30, 64, 175] } });

                    let finalY = doc.lastAutoTable.finalY + 10;
                    if (finalY + 55 > doc.internal.pageSize.getHeight()) { doc.addPage(); finalY = 20; }

                    doc.setFontSize(9); doc.setFont("helvetica", "italic"); doc.text("Catatan:", 14, finalY);
                    doc.text("Tidak dibenarkan memindahkan barang-barang yang tercantum pada daftar ini tanpa sepengetahuan Penanggung Jawab.", 14, finalY + 5);

                    finalY += 15; doc.setFontSize(9); doc.setFont("helvetica", "normal");
                    const rightX = doc.internal.pageSize.getWidth() - 14;

                    doc.text("Mengetahui,", 14, finalY); doc.text(`Palangka Raya, ${formatDateID(today)}`, rightX, finalY, { align: 'right' });
                    finalY += 5;
                    const splitJab = doc.splitTextToSize(appConfig.jabatanPimpinan, 85);
                    doc.text(splitJab, 14, finalY); doc.text("Penanggung Jawab", rightX, finalY, { align: 'right' });
                    doc.text(roomInfo.jabatan, rightX, finalY + 4, { align: 'right' });

                    finalY += Math.max((splitJab.length * 4), 10) + 14;
                    doc.setFont("helvetica", "bold"); doc.text(appConfig.namaPimpinan, 14, finalY); doc.text(roomInfo.pj, rightX, finalY, { align: 'right' });
                    doc.setFont("helvetica", "normal"); doc.text(`NIP. ${appConfig.nipPimpinan}`, 14, finalY + 5); doc.text(`NIP. ${roomInfo.nipPj}`, rightX, finalY + 5, { align: 'right' });

                    doc.save(`KIR_${selectedRuang}.pdf`);
                } 
                else if (format === 'Excel') {
                    const wsData = [
                        ["DAFTAR BARANG RUANGAN"], [], ["Kota", ": Palangka Raya"], ["SOPD", `: ${appConfig.appName}`], ["Nama Ruangan", `: ${selectedRuang}`], [],
                        ["No", "Nama Barang", "Merk/Type", "Jumlah", "Satuan", "Tahun", "Kode Barang"],
                        ...dataRuangan.map((b, i) => [i + 1, b.nama, b.merk, 1, 'unit', b.tahun, b.kode]), [],
                        ["Catatan:"], ["Tidak dibenarkan memindahkan barang-barang yang tercantum pada daftar ini tanpa sepengetahuan Penanggung Jawab."], [],
                        ["Mengetahui,", "", "", "", "", "", `Palangka Raya, ${formatDateID(today)}`],
                        [appConfig.jabatanPimpinan, "", "", "", "", "", "Penanggung Jawab"], ["", "", "", "", "", "", roomInfo.jabatan], [], [], [],
                        [appConfig.namaPimpinan, "", "", "", "", "", roomInfo.pj], [`NIP. ${appConfig.nipPimpinan}`, "", "", "", "", "", `NIP. ${roomInfo.nipPj}`]
                    ];
                    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(wsData), "KIR"); XLSX.writeFile(wb, `KIR_${selectedRuang}.xlsx`);
                }
            };

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <div className="flex justify-between items-end mb-6">
                        <div><label className="block text-sm font-bold mb-2">Filter Ruangan</label><select value={selectedRuang} onChange={(e) => setSelectedRuang(e.target.value)} className="border px-4 py-2 rounded-md">{ruanganList.map(r => <option key={r.id} value={r.nama}>{r.nama}</option>)}</select></div>
                        <div className="space-x-2"><button onClick={() => exportKIR('PDF')} className="bg-red-600 text-white px-4 py-2 rounded-md">Cetak PDF</button><button onClick={() => exportKIR('Excel')} className="bg-green-600 text-white px-4 py-2 rounded-md">Cetak Excel</button></div>
                    </div>
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Tahun</th><th className="p-3 border-b">Kode</th></tr></thead>
                        <tbody>{filteredBarang.map(item => (<tr key={item.id} className="border-b text-sm"><td className="p-3 font-semibold">{item.nama}</td><td className="p-3">{item.tahun}</td><td className="p-3">{item.kode}</td></tr>))}</tbody>
                    </table>
                </div>
            );
        }

        // ==========================================
        // 6. KOMPONEN PENGADAAN
        // ==========================================
        function Pengadaan({ user, pengadaanList, setPengadaanList }) {
            const [isFormMode, setIsFormMode] = useState(false);
            const [formData, setFormData] = useState({ namaBarang: '', jumlah: 1, estimasiHarga: '', peruntukan: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                setPengadaanList([{ ...formData, noUsulan: `PGD-${Date.now()}`, tglUsul: new Date().toISOString().split('T')[0], pengusul: user.name, id: Date.now() }, ...pengadaanList]);
                setIsFormMode(false);
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-6 max-w-xl">
                        <h2 className="text-xl font-bold mb-4">Buat Usulan Pengadaan</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm mb-1">Nama Barang</label><input type="text" required value={formData.namaBarang} onChange={e=>setFormData({...formData, namaBarang: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">Jumlah</label><input type="number" required value={formData.jumlah} onChange={e=>setFormData({...formData, jumlah: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">Peruntukan</label><input type="text" required value={formData.peruntukan} onChange={e=>setFormData({...formData, peruntukan: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div className="flex justify-end gap-2"><button type="button" onClick={()=>setIsFormMode(false)} className="bg-gray-200 px-4 py-2 rounded">Batal</button><button type="submit" className="bg-teal-600 text-white px-4 py-2 rounded">Simpan</button></div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <button onClick={() => setIsFormMode(true)} className="bg-teal-600 text-white px-4 py-2 rounded mb-4">+ Usulan Baru</button>
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">No Usulan</th><th className="p-3 border-b">Barang</th><th className="p-3 border-b">Jml</th><th className="p-3 border-b">Peruntukan</th><th className="p-3 border-b">Pengusul</th></tr></thead>
                        <tbody>{pengadaanList.map(item => (<tr key={item.id} className="border-b text-sm"><td className="p-3">{item.noUsulan}</td><td className="p-3">{item.namaBarang}</td><td className="p-3">{item.jumlah}</td><td className="p-3">{item.peruntukan}</td><td className="p-3">{item.pengusul}</td></tr>))}</tbody>
                    </table>
                </div>
            );
        }

        // ==========================================
        // 7. KOMPONEN PENGHAPUSAN
        // ==========================================
        function Penghapusan({ user, appConfig, barangList, setBarangList, usulanHapus, setUsulanHapus }) {
            const proposedForHapus = barangList.filter(b => usulanHapus.includes(b.id));

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <h2 className="text-xl font-bold mb-4">Daftar Usulan Penghapusan</h2>
                    <table className="w-full text-left border-collapse mb-4">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Kode</th><th className="p-3 border-b">Nama Barang</th><th className="p-3 border-b">Ruang</th></tr></thead>
                        <tbody>
                            {proposedForHapus.length > 0 ? proposedForHapus.map(item => (
                                <tr key={item.id} className="border-b text-sm"><td className="p-3">{item.kode}</td><td className="p-3">{item.nama}</td><td className="p-3">{item.ruang}</td></tr>
                            )) : <tr><td colSpan="3" className="p-4 text-center text-gray-500">Belum ada data usulan hapus.</td></tr>}
                        </tbody>
                    </table>
                    <p className="text-sm text-gray-500 italic">*Untuk menambah usulan, Anda dapat mengubah status barang menjadi Rusak Berat di menu Data Barang lalu mengajukannya (versi full).</p>
                </div>
            );
        }

        // ==========================================
        // 8. KOMPONEN RUANGAN
        // ==========================================
        function Ruangan({ ruanganList, setRuanganList, user }) {
            const [isFormMode, setIsFormMode] = useState(false);
            const [formData, setFormData] = useState({ nama: '', pj: '', jabatan: '', nipPj: '' });

            const handleSubmit = (e) => {
                e.preventDefault();
                setRuanganList([...ruanganList, { id: Date.now(), no: `R-${Date.now().toString().slice(-3)}`, ...formData }]);
                setIsFormMode(false);
            };

            if (isFormMode) {
                return (
                    <div className="bg-white rounded-lg shadow p-6 max-w-xl">
                        <h2 className="text-xl font-bold mb-4">Tambah Ruangan</h2>
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div><label className="block text-sm mb-1">Nama Ruangan</label><input type="text" required value={formData.nama} onChange={e=>setFormData({...formData, nama:e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">Nama Penanggung Jawab</label><input type="text" required value={formData.pj} onChange={e=>setFormData({...formData, pj:e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">NIP PJ</label><input type="text" value={formData.nipPj} onChange={e=>setFormData({...formData, nipPj:e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">Jabatan</label><input type="text" required value={formData.jabatan} onChange={e=>setFormData({...formData, jabatan:e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div className="flex justify-end gap-2"><button type="button" onClick={()=>setIsFormMode(false)} className="bg-gray-200 px-4 py-2 rounded">Batal</button><button type="submit" className="bg-teal-600 text-white px-4 py-2 rounded">Simpan</button></div>
                        </form>
                    </div>
                );
            }

            return (
                <div className="bg-white rounded-lg shadow p-6">
                    {(user.role === 'adminsuper' || user.role === 'pengurus') && <button onClick={() => setIsFormMode(true)} className="bg-teal-600 text-white px-4 py-2 rounded mb-4">+ Tambah Ruangan</button>}
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">No Ruang</th><th className="p-3 border-b">Nama Ruangan</th><th className="p-3 border-b">Penanggung Jawab</th><th className="p-3 border-b">Jabatan</th></tr></thead>
                        <tbody>{ruanganList.map(r => (<tr key={r.id} className="border-b text-sm"><td className="p-3">{r.no}</td><td className="p-3 font-semibold">{r.nama}</td><td className="p-3">{r.pj}<br/><span className="text-xs text-gray-500">NIP: {r.nipPj||'-'}</span></td><td className="p-3">{r.jabatan}</td></tr>))}</tbody>
                    </table>
                </div>
            );
        }

        // ==========================================
        // 9. KOMPONEN PEMELIHARAAN & 10. ADUAN (GABUNGAN SEDERHANA)
        // ==========================================
        function Pemeliharaan({ pemeliharaanList }) {
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <h2 className="text-xl font-bold mb-4">Daftar Pemeliharaan</h2>
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Tanggal</th><th className="p-3 border-b">Barang</th><th className="p-3 border-b">Kegiatan</th><th className="p-3 border-b">Status</th></tr></thead>
                        <tbody>{pemeliharaanList.map(item => (<tr key={item.id} className="border-b text-sm"><td className="p-3">{item.tanggal}</td><td className="p-3">{item.namaBarang}</td><td className="p-3">{item.kegiatan}</td><td className="p-3">{item.status}</td></tr>))}</tbody>
                    </table>
                </div>
            );
        }

        function Aduan({ aduanList }) {
            return (
                <div className="bg-white rounded-lg shadow p-6">
                    <h2 className="text-xl font-bold mb-4">Daftar Aduan Kerusakan</h2>
                    <table className="w-full text-left border-collapse">
                        <thead><tr className="bg-gray-100 text-sm"><th className="p-3 border-b">Tanggal</th><th className="p-3 border-b">Barang</th><th className="p-3 border-b">Keluhan</th><th className="p-3 border-b">Status</th></tr></thead>
                        <tbody>{aduanList.map(item => (<tr key={item.id} className="border-b text-sm"><td className="p-3">{item.tanggal}</td><td className="p-3">{item.namaBarang}</td><td className="p-3">{item.keterangan}</td><td className="p-3">{item.status}</td></tr>))}</tbody>
                    </table>
                </div>
            );
        }

        // ==========================================
        // 11. KOMPONEN LAPORAN
        // ==========================================
        function Laporan() {
            return (
                <div className="bg-white rounded-lg shadow p-6 text-center">
                    <h2 className="text-xl font-bold mb-4">Pusat Laporan</h2>
                    <p className="text-gray-600 mb-4">Silakan gunakan fitur Export PDF/Excel yang ada di masing-masing menu Data Barang dan Inventaris Barang (KIR).</p>
                </div>
            );
        }

        // ==========================================
        // 12. KOMPONEN PENGATURAN
        // ==========================================
        function Pengaturan({ user, appConfig, setAppConfig }) {
            const [localConfig, setLocalConfig] = useState(appConfig);
            if (user.role === 'pegawai') return <div className="p-6 text-center text-red-700">Akses Ditolak</div>;

            const handleSave = (e) => { e.preventDefault(); setAppConfig(localConfig); alert('Pengaturan disimpan ke Firebase!'); };

            return (
                <div className="max-w-3xl bg-white rounded-lg shadow p-6">
                    <h2 className="text-xl font-bold mb-4">Pengaturan Sistem</h2>
                    <form onSubmit={handleSave} className="space-y-4">
                        <div><label className="block text-sm mb-1">Nama Instansi</label><input type="text" value={localConfig.appName} onChange={e=>setLocalConfig({...localConfig, appName: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                        <div><label className="block text-sm mb-1">Passphrase Eksekusi</label><input type="text" value={localConfig.systemPassphrase} onChange={e=>setLocalConfig({...localConfig, systemPassphrase: e.target.value})} className="w-full md:w-1/2 border px-3 py-2 rounded bg-red-50" /></div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="block text-sm mb-1">Nama Pimpinan</label><input type="text" value={localConfig.namaPimpinan} onChange={e=>setLocalConfig({...localConfig, namaPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                            <div><label className="block text-sm mb-1">NIP Pimpinan</label><input type="text" value={localConfig.nipPimpinan} onChange={e=>setLocalConfig({...localConfig, nipPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                        </div>
                        <div><label className="block text-sm mb-1">Jabatan Pimpinan</label><input type="text" value={localConfig.jabatanPimpinan} onChange={e=>setLocalConfig({...localConfig, jabatanPimpinan: e.target.value})} className="w-full border px-3 py-2 rounded" /></div>
                        <div className="pt-4"><button type="submit" className="bg-blue-600 text-white px-6 py-2 rounded">Simpan Pengaturan</button></div>
                    </form>
                </div>
            );
        }

        // ==========================================
        // 13. APP UTAMA DENGAN AUTO-SYNC FIREBASE
        // ==========================================
        function App() {
            const [user, setUser] = useState(null); 
            const [currentPage, setCurrentPage] = useState('dashboard');
            const [navParams, setNavParams] = useState(null);
            
            // State penanda loading saat aplikasi mengambil data awal dari Firebase
            const [isLoadingData, setIsLoadingData] = useState(true);

            // Default State
            const [appConfig, setAppConfig] = useState({ appName: 'Badan Kepegawaian', jabatanPimpinan: 'Kepala Badan', namaPimpinan: 'Dr. FAUZI RAHMAN', nipPimpinan: '19750317 199903 1 004', systemPassphrase: 'rahasia123' });
            const [barangList, setBarangList] = useState([]);
            const [ruanganList, setRuanganList] = useState([{ id: 1, no: 'R-001', nama: 'Ruangan UMPEG', pj: 'ERI PURWATI, S.Sos', jabatan: 'Kasubag', nipPj: '19830505' }]);
            const [aduanList, setAduanList] = useState([]);
            const [pemeliharaanList, setPemeliharaanList] = useState([]);
            const [pengadaanList, setPengadaanList] = useState([]);
            const [usulanHapus, setUsulanHapus] = useState([]);

            // PROSES 1: TARIK DATA DARI FIREBASE SAAT APLIKASI DIBUKA
            useEffect(() => {
                db.collection('AsetKitaDB').doc('DataUtama').get().then((doc) => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.appConfig) setAppConfig(data.appConfig);
                        if (data.barangList && data.barangList.length > 0) setBarangList(data.barangList);
                        if (data.ruanganList && data.ruanganList.length > 0) setRuanganList(data.ruanganList);
                        if (data.aduanList) setAduanList(data.aduanList);
                        if (data.pemeliharaanList) setPemeliharaanList(data.pemeliharaanList);
                        if (data.pengadaanList) setPengadaanList(data.pengadaanList);
                        if (data.usulanHapus) setUsulanHapus(data.usulanHapus);
                    } else {
                        console.log("Data kosong di Firebase, akan menggunakan default.");
                    }
                    setIsLoadingData(false);
                }).catch((error) => {
                    console.error("Gagal menarik data Firebase, pastikan Config benar:", error);
                    setIsLoadingData(false); 
                });
            }, []);

            // PROSES 2: SIMPAN OTOMATIS KE FIREBASE JIKA ADA PERUBAHAN
            useEffect(() => {
                if (!isLoadingData) {
                    db.collection('AsetKitaDB').doc('DataUtama').set({
                        appConfig, barangList, ruanganList, aduanList, pemeliharaanList, pengadaanList, usulanHapus
                    }).catch(err => console.error("Gagal simpan ke Firebase:", err));
                }
            }, [appConfig, barangList, ruanganList, aduanList, pemeliharaanList, pengadaanList, usulanHapus, isLoadingData]);

            const handleNavigate = (page, params = null) => { setCurrentPage(page); setNavParams(params); };

            // Tampilan Loading saat memuat dari Firebase
            if (isLoadingData) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-gray-50 text-blue-600">
                        <svg className="w-12 h-12 animate-spin mb-4" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                        <h2 className="text-xl font-bold">Sinkronisasi Database Firebase...</h2>
                        <p className="text-sm text-gray-500 mt-2">Mohon tunggu, menarik data...</p>
                    </div>
                );
            }

            if (!user) return <Login onLogin={(userData) => { setUser(userData); handleNavigate('dashboard'); }} />;

            return (
                <Layout user={user} currentPage={currentPage} onNavigate={handleNavigate} onLogout={() => setUser(null)}>
                    {currentPage === 'dashboard' && <Dashboard />}
                    {currentPage === 'databarang' && <DataBarang user={user} appConfig={appConfig} ruanganList={ruanganList} barangList={barangList} setBarangList={setBarangList} />}
                    {currentPage === 'inventaris' && <Inventaris appConfig={appConfig} ruanganList={ruanganList} barangList={barangList} setBarangList={setBarangList} />}
                    {currentPage === 'pengadaan' && <Pengadaan user={user} pengadaanList={pengadaanList} setPengadaanList={setPengadaanList} />}
                    {currentPage === 'penghapusan' && <Penghapusan user={user} appConfig={appConfig} barangList={barangList} setBarangList={setBarangList} usulanHapus={usulanHapus} setUsulanHapus={setUsulanHapus} />}
                    {currentPage === 'ruangan' && <Ruangan ruanganList={ruanganList} setRuanganList={setRuanganList} user={user} />}
                    {currentPage === 'pemeliharaan' && <Pemeliharaan pemeliharaanList={pemeliharaanList} />}
                    {currentPage === 'aduan' && <Aduan aduanList={aduanList} />}
                    {currentPage === 'laporan' && <Laporan />}
                    {currentPage === 'pengaturan' && <Pengaturan user={user} appConfig={appConfig} setAppConfig={setAppConfig} />}
                </Layout>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
